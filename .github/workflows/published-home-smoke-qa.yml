name: MOVX Published Home Smoke QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-home-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-published-home.log 2>&1

      - name: Smoke test published CRT-only homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-published-home
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const base='https://videoia070707-design.github.io/Portifolio/';
          const critical=/\.(?:glb|gltf|mjs|js|css)(?:\?|$)/i;
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={url:base,desktop:{},mobile:{},captureWarnings:[],errors:[]};

          const wireErrors=(page,bucket)=>{
            page.on('pageerror',error=>bucket.push(`PAGEERROR ${String(error)}`));
            page.on('response',response=>{if(response.status()>=400&&critical.test(response.url()))bucket.push(`HTTP ${response.status()} ${response.url()}`);});
            page.on('requestfailed',request=>{if(critical.test(request.url()))bucket.push(`REQUEST FAILED ${request.url()} ${request.failure()?.errorText||''}`);});
          };
          const snap=async(page,path)=>{try{await page.screenshot({path,fullPage:false,animations:'disabled',timeout:10000});}catch(error){report.captureWarnings.push({path,error:String(error)});}};
          const focus=async(page,selector)=>{
            const found=await page.evaluate(sel=>{const el=document.querySelector(sel);if(!el)return false;const r=el.getBoundingClientRect();const top=Math.max(0,window.scrollY+r.top-(window.innerHeight-r.height)/2);window.scrollTo({top,behavior:'instant'});return true;},selector);
            if(!found)throw new Error(`Published CRT slot missing during focus: ${selector}`);await page.waitForTimeout(450);
          };
          const save=()=>writeFile('qa-published-home/report.json',JSON.stringify(report,null,2));
          const readCRT=page=>page.evaluate(()=>{
            const i=window.MOVX3D?.runtime?.instances?.['boot-tv'];
            return {
              title:document.title,scope:document.documentElement.dataset.modelScope||null,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              domSlots:document.querySelectorAll('[data-model-slot]').length,
              visibleCanvases:document.querySelectorAll('.v322-model-renderer canvas').length,
              loaded:!!i?.loaded,error:i?.error||null,glbState:i?.element?.dataset?.glbState||null,
              triangles:i?.stats?.triangles||0,screen:i?.channels?.screen?.name||null,channel:i?.channels?.state?.channel||null,
              channels:!!i?.channels,tactility:!!i?.tactility,direct:!!i?.directManipulation,object:!!i?.objectInteraction,physics:!!i?.channelPhysics,presence:!!i?.presence,
              physicsChannel:i?.channelPhysics?.state?.channel||null,physicsEnergy:i?.channelPhysics?.state?.autonomousEnergy??null,
              presenceHover:i?.presence?.state?.hoverMix??null,previewProcedural:!!i?.previewProcedural,
              loadingMode:document.documentElement.dataset.crtLoading||null,
              tactilityMarker:document.documentElement.dataset.crtTactility||null,
              directMarker:document.documentElement.dataset.crtDirect||null,
              objectMarker:document.documentElement.dataset.crtObject||null,
              physicsMarker:document.documentElement.dataset.crtChannelPhysics||null,
              presenceMarker:document.documentElement.dataset.crtPresence||null,
              legacyRendered:['hero-movx-logo','x-portal','creative-machine','play-camera','play-cube','spatial-studio'].filter(name=>!!window.MOVX3D?.runtime?.instances?.[name]?.renderer)
            };
          });

          try{
            const desktopErrors=[];
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});wireErrors(page,desktopErrors);
            const response=await page.goto(`${base}?qa-published=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()>=400)throw new Error(`Published homepage HTTP failure: ${response?.status()??'no response'}`);
            await page.waitForFunction(()=>!!window.MOVX3D?.runtime,null,{timeout:30000});
            const crt='[data-model-slot="boot-tv"]';if(await page.locator(crt).count()!==1)throw new Error('Published boot-tv slot missing');await focus(page,crt);
            await page.waitForFunction(()=>{const i=window.MOVX3D?.runtime?.instances?.['boot-tv'];return !!(i?.loaded||i?.error);},null,{timeout:90000});
            await page.waitForFunction(()=>{const i=window.MOVX3D?.runtime?.instances?.['boot-tv'];return !!(i?.channels&&i?.tactility&&i?.directManipulation&&i?.objectInteraction&&i?.channelPhysics&&i?.presence);},null,{timeout:20000});
            const desktop=await readCRT(page);Object.assign(report.desktop,desktop,{resourceErrors:desktopErrors});await save();
            if(desktop.scope!=='v350-crt-only')throw new Error(`Published model scope drifted: ${desktop.scope}`);
            if(desktop.overflow>2)throw new Error(`Published desktop horizontal overflow: ${desktop.overflow}`);
            if(desktop.error)throw new Error(`Published CRT GLB failed: ${desktop.error}`);
            if(!desktop.loaded||desktop.glbState!=='ready')throw new Error(`Published CRT not ready: ${JSON.stringify(desktop)}`);
            if(desktop.triangles!==44831)throw new Error(`Published CRT geometry changed: ${desktop.triangles}`);
            if(desktop.screen!=='tripo_part_1'||!desktop.channels||!desktop.tactility||!desktop.direct||!desktop.object||!desktop.physics||!desktop.presence)throw new Error(`Published CRT experience incomplete: ${JSON.stringify(desktop)}`);
            if(desktop.loadingMode!=='poster-only')throw new Error(`Published loading mode regressed: ${desktop.loadingMode}`);
            if(desktop.previewProcedural)throw new Error('Published healthy boot mounted the procedural preview');
            if(desktop.directMarker!=='v363-ready')throw new Error(`Published v363 direct marker missing: ${desktop.directMarker}`);
            if(desktop.objectMarker!=='v364-ready')throw new Error(`Published v364 object marker missing: ${desktop.objectMarker}`);
            if(desktop.physicsMarker!=='v365-ready')throw new Error(`Published v365 physics marker missing: ${desktop.physicsMarker}`);
            if(desktop.presenceMarker!=='v366-ready')throw new Error(`Published v366 presence marker missing: ${desktop.presenceMarker}`);
            if(desktop.visibleCanvases!==1)throw new Error(`Expected one production WebGL canvas, got ${desktop.visibleCanvases}`);
            if(desktop.legacyRendered.length)throw new Error(`Legacy 3D slots rendered unexpectedly: ${desktop.legacyRendered.join(', ')}`);
            if(desktopErrors.length)throw new Error(`Published desktop critical resource errors: ${JSON.stringify(desktopErrors)}`);

            const canvas=await page.locator('#boot .v322-model-renderer canvas').boundingBox();
            if(canvas){await page.mouse.move(canvas.x+canvas.width*.4,canvas.y+canvas.height*.46,{steps:7});await page.waitForTimeout(380)}
            const present=await readCRT(page);if(!(present.presenceHover>0))throw new Error(`Published CRT pointer presence did not engage: ${JSON.stringify(present)}`);
            report.desktop.pointerPresence=true;

            await page.locator('[data-crt-mode-control="motion"]').click();
            await page.waitForFunction(()=>{const i=window.MOVX3D.runtime.instances['boot-tv'];return i.channels.state.channel==='motion'&&i.channelPhysics.state.channel==='motion';},null,{timeout:8000});
            await page.waitForTimeout(500);
            const motion=await readCRT(page);if(motion.physicsChannel!=='motion'||!(motion.physicsEnergy>0))throw new Error(`Published Motion channel lacks physical response: ${JSON.stringify(motion)}`);
            report.desktop.motionChannel=true;report.desktop.motionPhysics=true;await save();await snap(page,'qa-published-home/desktop.png');await page.close();

            const mobileErrors=[];
            const mobilePage=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,hasTouch:true,isMobile:true});wireErrors(mobilePage,mobileErrors);
            const mobileResponse=await mobilePage.goto(`${base}?qa-published-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!mobileResponse||mobileResponse.status()>=400)throw new Error(`Published mobile homepage HTTP failure: ${mobileResponse?.status()??'no response'}`);
            await mobilePage.waitForFunction(()=>!!window.MOVX3D?.runtime,null,{timeout:30000});
            if(await mobilePage.locator(crt).count()!==1)throw new Error('Published mobile boot-tv slot missing');await focus(mobilePage,crt);
            await mobilePage.waitForFunction(()=>{const i=window.MOVX3D?.runtime?.instances?.['boot-tv'];return !!(i?.loaded||i?.error);},null,{timeout:90000});
            await mobilePage.waitForFunction(()=>{const i=window.MOVX3D?.runtime?.instances?.['boot-tv'];return !!(i?.channels&&i?.tactility&&i?.directManipulation&&i?.objectInteraction&&i?.channelPhysics&&i?.presence);},null,{timeout:20000});
            const mobile=await readCRT(mobilePage);Object.assign(report.mobile,mobile,{resourceErrors:mobileErrors});await save();
            if(mobile.scope!=='v350-crt-only')throw new Error(`Published mobile model scope drifted: ${mobile.scope}`);
            if(mobile.overflow>2)throw new Error(`Published mobile horizontal overflow: ${mobile.overflow}`);
            if(mobile.error)throw new Error(`Published mobile CRT GLB failed: ${mobile.error}`);
            if(!mobile.loaded||mobile.glbState!=='ready'||mobile.triangles!==44831)throw new Error(`Published mobile CRT invalid: ${JSON.stringify(mobile)}`);
            if(!mobile.channels||!mobile.tactility||!mobile.direct||!mobile.object||!mobile.physics||!mobile.presence||mobile.visibleCanvases!==1)throw new Error(`Published mobile CRT interaction incomplete: ${JSON.stringify(mobile)}`);
            if(mobile.loadingMode!=='poster-only'||mobile.previewProcedural)throw new Error(`Published mobile loading mode regressed: ${JSON.stringify(mobile)}`);
            if(mobile.directMarker!=='v363-ready')throw new Error(`Published mobile v363 marker missing: ${mobile.directMarker}`);
            if(mobile.objectMarker!=='v364-ready')throw new Error(`Published mobile v364 marker missing: ${mobile.objectMarker}`);
            if(mobile.physicsMarker!=='v365-ready')throw new Error(`Published mobile v365 marker missing: ${mobile.physicsMarker}`);
            if(mobile.presenceMarker!=='v366-ready')throw new Error(`Published mobile v366 marker missing: ${mobile.presenceMarker}`);
            if(mobile.legacyRendered.length)throw new Error(`Legacy mobile 3D slots rendered unexpectedly: ${mobile.legacyRendered.join(', ')}`);
            if(mobileErrors.length)throw new Error(`Published mobile critical resource errors: ${JSON.stringify(mobileErrors)}`);
            await snap(mobilePage,'qa-published-home/mobile.png');await mobilePage.close();

            report.status='passed';await save();await browser.close();
            console.log(JSON.stringify({status:'passed',url:base,scope:report.desktop.scope,triangles:report.desktop.triangles,channels:report.desktop.channels,tactility:report.desktop.tactility,direct:report.desktop.direct,object:report.desktop.object,physics:report.desktop.physics,presence:report.desktop.presence,pointerPresence:report.desktop.pointerPresence,motionChannel:report.desktop.motionChannel,motionPhysics:report.desktop.motionPhysics}));
          }catch(error){report.status='failed';report.errors.push(String(error));await save();await browser.close();throw error;}
          NODE

      - name: Upload published homepage smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-published-home-smoke
          path: qa-published-home
          if-no-files-found: warn
          retention-days: 7