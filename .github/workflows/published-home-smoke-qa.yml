name: MOVX Published Home Smoke QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-home-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-published-home.log 2>&1

      - name: Smoke test published homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-published-home
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const base='https://videoia070707-design.github.io/Portifolio/';
          const productionSlots=[
            'hero-movx-logo',
            'x-portal',
            'creative-machine',
            'play-camera',
            'play-cube',
            'spatial-studio'
          ];
          const critical=/\.(?:glb|gltf|mjs|js|css)(?:\?|$)/i;
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={url:base,desktop:{slots:{}},mobile:{},captureWarnings:[],errors:[]};

          const wireErrors=(page,bucket)=>{
            page.on('pageerror',error=>bucket.push(`PAGEERROR ${String(error)}`));
            page.on('response',response=>{
              if(response.status()>=400&&critical.test(response.url())) bucket.push(`HTTP ${response.status()} ${response.url()}`);
            });
            page.on('requestfailed',request=>{
              if(critical.test(request.url())) bucket.push(`REQUEST FAILED ${request.url()} ${request.failure()?.errorText||''}`);
            });
          };
          const snap=async(page,path)=>{
            try{
              await page.screenshot({path,fullPage:false,animations:'disabled',timeout:10000});
            }catch(error){
              report.captureWarnings.push({path,error:String(error)});
            }
          };
          const save=()=>writeFile('qa-published-home/report.json',JSON.stringify(report,null,2));

          try{
            const desktopErrors=[];
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            wireErrors(page,desktopErrors);
            const response=await page.goto(`${base}?qa-published=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!response||response.status()>=400) throw new Error(`Published homepage HTTP failure: ${response?.status()??'no response'}`);
            await page.waitForFunction(()=>document.documentElement.dataset.modelFramingRevision==='v3361-mobile-logo-safe-fit',null,{timeout:30000});
            await page.waitForFunction(()=>document.documentElement.dataset.modelChoreography==='v331-smooth-handoffs',null,{timeout:30000});

            const desktopBase=await page.evaluate(()=>({
              title:document.title,
              slotCount:document.querySelectorAll('[data-model-slot]').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              framingRevision:document.documentElement.dataset.modelFramingRevision||null,
              choreography:document.documentElement.dataset.modelChoreography||null,
              runtime:!!window.MOVX3D?.runtime
            }));
            Object.assign(report.desktop,desktopBase);
            if(desktopBase.slotCount<11) throw new Error(`Published homepage slot contract incomplete: ${desktopBase.slotCount}/11`);
            if(desktopBase.overflow>2) throw new Error(`Published desktop horizontal overflow: ${desktopBase.overflow}`);
            if(!desktopBase.runtime) throw new Error('MOVX3D runtime missing on published homepage');

            for(const slot of productionSlots){
              const selector=`[data-model-slot="${slot}"]`;
              const loc=page.locator(selector).first();
              if(await loc.count()!==1) throw new Error(`Published slot missing: ${slot}`);
              await loc.scrollIntoViewIfNeeded();
              await page.waitForTimeout(350);
              await page.waitForFunction(name=>{
                const i=window.MOVX3D?.runtime?.instances?.[name];
                return !!(i?.loaded||i?.error);
              },slot,{timeout:90000});
              const state=await page.evaluate(name=>{
                const i=window.MOVX3D?.runtime?.instances?.[name];
                return {
                  loaded:!!i?.loaded,
                  error:i?.error||null,
                  glbState:i?.element?.dataset?.glbState||null,
                  framing:i?.element?.dataset?.modelFraming||null,
                  framingRevision:i?.element?.dataset?.modelFramingRevision||null,
                  choreography:i?.element?.dataset?.modelChoreography||null,
                  triangles:i?.stats?.triangles||0,
                  sourceSize:i?.stats?.sourceSize||null
                };
              },slot);
              report.desktop.slots[slot]=state;
              await save();
              if(state.error) throw new Error(`${slot} published GLB failed: ${state.error}`);
              if(!state.loaded||state.glbState!=='ready') throw new Error(`${slot} not ready on published homepage: ${JSON.stringify(state)}`);
              if(state.framing!=='v324'||state.framingRevision!=='v3361-mobile-logo-safe-fit') throw new Error(`${slot} framing contract missing: ${JSON.stringify(state)}`);
              if(state.choreography!=='v331') throw new Error(`${slot} choreography contract missing: ${JSON.stringify(state)}`);
              if(state.triangles<1000) throw new Error(`${slot} published geometry missing: ${state.triangles} triangles`);
            }
            report.desktop.resourceErrors=desktopErrors;
            if(desktopErrors.length) throw new Error(`Published desktop critical resource errors: ${JSON.stringify(desktopErrors)}`);
            await snap(page,'qa-published-home/desktop.png');
            await page.close();

            const mobileErrors=[];
            const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,hasTouch:true,isMobile:true});
            wireErrors(mobile,mobileErrors);
            const mobileResponse=await mobile.goto(`${base}?qa-published-mobile=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            if(!mobileResponse||mobileResponse.status()>=400) throw new Error(`Published mobile homepage HTTP failure: ${mobileResponse?.status()??'no response'}`);
            await mobile.waitForFunction(()=>document.documentElement.dataset.modelFramingRevision==='v3361-mobile-logo-safe-fit',null,{timeout:30000});
            const hero=mobile.locator('[data-model-slot="hero-movx-logo"]').first();
            if(await hero.count()!==1) throw new Error('Published mobile hero logo slot missing');
            await hero.scrollIntoViewIfNeeded();
            await mobile.waitForFunction(()=>{
              const i=window.MOVX3D?.runtime?.instances?.['hero-movx-logo'];
              return !!(i?.loaded||i?.error);
            },null,{timeout:90000});
            const mobileState=await mobile.evaluate(()=>{
              const i=window.MOVX3D?.runtime?.instances?.['hero-movx-logo'];
              return {
                width:innerWidth,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                slotCount:document.querySelectorAll('[data-model-slot]').length,
                loaded:!!i?.loaded,
                error:i?.error||null,
                glbState:i?.element?.dataset?.glbState||null,
                mobileLogoFit:i?.element?.dataset?.mobileLogoFit||null,
                framingRevision:document.documentElement.dataset.modelFramingRevision||null,
                triangles:i?.stats?.triangles||0
              };
            });
            report.mobile={...mobileState,resourceErrors:mobileErrors};
            if(mobileState.overflow>2) throw new Error(`Published mobile horizontal overflow: ${mobileState.overflow}`);
            if(mobileState.slotCount<11) throw new Error(`Published mobile slot contract incomplete: ${mobileState.slotCount}/11`);
            if(mobileState.error) throw new Error(`Published mobile hero GLB failed: ${mobileState.error}`);
            if(!mobileState.loaded||mobileState.glbState!=='ready') throw new Error(`Published mobile hero not ready: ${JSON.stringify(mobileState)}`);
            if(mobileState.mobileLogoFit!=='v3361') throw new Error(`Published mobile logo safe-fit missing: ${JSON.stringify(mobileState)}`);
            if(mobileState.triangles<1000) throw new Error(`Published mobile hero geometry missing: ${mobileState.triangles}`);
            if(mobileErrors.length) throw new Error(`Published mobile critical resource errors: ${JSON.stringify(mobileErrors)}`);
            await snap(mobile,'qa-published-home/mobile.png');
            await mobile.close();

            report.status='passed';
            await save();
            await browser.close();
            console.log(JSON.stringify({status:'passed',url:base,desktopSlots:Object.keys(report.desktop.slots),mobileLogoFit:report.mobile.mobileLogoFit,captureWarnings:report.captureWarnings.length}));
          }catch(error){
            report.status='failed';
            report.errors.push(String(error));
            await save();
            await browser.close();
            throw error;
          }
          NODE

      - name: Upload published homepage smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-published-home-smoke
          path: qa-published-home
          if-no-files-found: warn
          retention-days: 7
