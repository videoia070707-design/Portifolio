name: MOVX Living Archive Mobile QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  living-archive-mobile-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1

      - name: Validate Living Archive on mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-living-archive
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const base='https://videoia070707-design.github.io/Portifolio/social-media.html';
          const viewports=[
            {id:'mobile-390',width:390,height:844},
            {id:'mobile-430',width:430,height:932}
          ];
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={page:base,pages:[]};

          for(const viewport of viewports){
            const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            await page.goto(`${base}?qa-living=${Date.now()}`,{waitUntil:'networkidle',timeout:45000});
            await page.waitForSelector('#livingArchive',{state:'attached',timeout:15000});
            await page.waitForSelector('#livingArchive .loop-card',{state:'attached',timeout:15000});
            await page.evaluate(()=>{
              const section=document.querySelector('#livingArchive');
              const top=window.scrollY+section.getBoundingClientRect().top;
              window.scrollTo(0,Math.max(0,top-68));
            });
            await page.waitForTimeout(1500);

            const state=await page.evaluate(()=>{
              const section=document.querySelector('#livingArchive');
              const heading=section?.querySelector('h2');
              const wall=section?.querySelector('.loop-wall');
              const rows=[...section?.querySelectorAll('.loop-row')||[]];
              const cards=[...section?.querySelectorAll('.loop-card')||[]];
              const images=cards.map(card=>card.querySelector('img')).filter(Boolean);
              const rect=el=>{
                if(!el)return null;
                const r=el.getBoundingClientRect();
                return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};
              };
              return {
                build:document.documentElement.dataset.movxBuild||'',
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                headingText:(heading?.innerText||'').trim().replace(/\s+/g,' '),
                heading:rect(heading),
                wall:rect(wall),
                rowCount:rows.length,
                cardCount:cards.length,
                visibleRows:rows.filter(row=>{
                  const r=row.getBoundingClientRect();
                  const cs=getComputedStyle(row);
                  return r.bottom>0&&r.top<innerHeight&&parseFloat(cs.opacity||'1')>.15&&cs.visibility!=='hidden'&&cs.display!=='none';
                }).length,
                loadedImages:images.filter(img=>img.complete&&img.naturalWidth>0).length,
                totalImages:images.length,
                heroImage:rect(document.querySelector('#heroTop .social-cover-art__image')),
                heroLeft:getComputedStyle(document.querySelector('#heroTop .social-cover-art__image')).left
              };
            });

            if(state.overflow>2) throw new Error(`${viewport.id}: horizontal overflow ${state.overflow}`);
            if(!state.heading) throw new Error(`${viewport.id}: Living Archive heading missing`);
            if(state.heading.left<-4||state.heading.right>viewport.width+4) throw new Error(`${viewport.id}: heading clipped ${JSON.stringify(state.heading)}`);
            if(!state.headingText.includes('Explore o arquivo em movimento')) throw new Error(`${viewport.id}: interaction-neutral copy missing: ${state.headingText}`);
            if(/cursor|hover/i.test(state.headingText)) throw new Error(`${viewport.id}: desktop-only interaction instruction returned: ${state.headingText}`);
            if(!state.wall||state.wall.width<viewport.width*.75) throw new Error(`${viewport.id}: Living Archive wall collapsed ${JSON.stringify(state.wall)}`);
            if(state.rowCount<2||state.cardCount<6) throw new Error(`${viewport.id}: Living Archive content incomplete rows=${state.rowCount} cards=${state.cardCount}`);
            if(state.visibleRows<1) throw new Error(`${viewport.id}: no Living Archive row readable in viewport`);
            if(state.loadedImages<Math.min(6,state.totalImages)) throw new Error(`${viewport.id}: Living Archive images not loaded ${state.loadedImages}/${state.totalImages}`);
            if(errors.length) throw new Error(`${viewport.id}: page errors ${errors.join(' | ')}`);

            await page.screenshot({path:`qa-living-archive/${viewport.id}.png`,fullPage:false});
            report.pages.push({viewport,url:page.url(),state,errors});
            await page.close();
          }

          await writeFile('qa-living-archive/report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE

      - name: Upload Living Archive QA
        uses: actions/upload-artifact@v4
        with:
          name: movx-living-archive-mobile-qa
          path: qa-living-archive
          retention-days: 7
