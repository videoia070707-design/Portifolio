name: Deploy MOVX Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MOVX v51 archive physics + preview QA
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'MOVX_Portfolio_v18*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::No MOVX source ZIP found in repository root"
            exit 1
          fi

          rm -rf _restore _site node_modules
          mkdir -p _restore _site
          unzip -q "$ZIP" -d _restore
          SOCIAL="$(find _restore -type f -name 'social-media.html' -print -quit)"
          test -n "$SOCIAL"
          ROOT="$(dirname "$SOCIAL")"
          cp -a "$ROOT"/. _site/

          if [ -s patches/v19-overrides.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v19-overrides.css >> _site/styles.css
          fi
          python3 case-order-v20.py _site/projects.js
          python3 v22-build.py _site
          if [ -s patches/v22-performance.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v22-performance.css >> _site/styles.css
          fi
          python3 patches/v23-copy.py _site

          for file in \
            patches/v28-motion-safe.css \
            patches/v30-polish.css \
            patches/v31-exhibition.css \
            patches/v32-editorial-architecture.css \
            patches/v33-case-editorial.css \
            patches/v34-quiet-loud.css \
            patches/v35-narrative-chapters.css \
            patches/v36-opening-sequence.css \
            patches/v37-performance-editorial.css \
            patches/v38-selected-cases.css \
            patches/v39-depth-motion.css \
            patches/v41-project-transitions.css \
            patches/v42-visual-recovery.css; do
            test -s "$file"
            printf '\n\n' >> _site/styles.css
            cat "$file" >> _site/styles.css
          done

          for file in \
            patches/v30-motion-premium.js \
            patches/v31-exhibition.js \
            patches/v32-editorial-architecture.js \
            patches/v33-case-editorial.js \
            patches/v34-quiet-loud.js \
            patches/v35-narrative-chapters.js \
            patches/v36-opening-sequence.js \
            patches/v37-performance-editorial.js \
            patches/v38-selected-cases.js \
            patches/v39-depth-motion.js \
            patches/v41-project-transitions.js; do
            test -s "$file"
            printf '\n\n' >> _site/script.js
            cat "$file" >> _site/script.js
          done

          python3 patches/v37-runtime-audit.py _site
          python3 patches/v38-runtime-audit.py _site

          npm install --silent --no-progress --no-audit --no-fund --no-save three@0.180.0 gsap@3.13.0 playwright@1.55.0
          mkdir -p _site/vendor
          cp node_modules/three/build/three.module.min.js _site/vendor/three.module.min.js
          cp node_modules/gsap/dist/gsap.min.js _site/vendor/gsap.min.js
          cp node_modules/gsap/dist/ScrollTrigger.min.js _site/vendor/ScrollTrigger.min.js

          cp patches/v45-immersive-continuity.css _site/v45-immersive.css
          cp patches/v45-immersive-continuity.mjs _site/v45-immersive.mjs
          cp patches/v46-niche-recovery.css _site/v46-niche.css
          cp patches/v46-niche-recovery.js _site/v46-niche.js
          cp patches/v47-clean-territories.css _site/v47-territories.css
          cp patches/v47-archive-flow.js _site/v47-archive-flow.js
          cp patches/v48-spatial-polish.css _site/v48-spatial.css
          cp patches/v48-spatial-polish.js _site/v48-spatial.js
          cp patches/v49-journey-continuity.css _site/v49-journey.css
          cp patches/v49-journey-continuity.mjs _site/v49-journey.mjs
          cp patches/v51-archive-physics.css _site/v51-physics.css
          cp patches/v51-archive-physics.mjs _site/v51-physics.mjs

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('_site/social-media.html')
          h = p.read_text(encoding='utf-8')
          m = re.search(r'<html([^>]*)>', h, flags=re.I)
          if not m:
              raise SystemExit('No <html> element found')
          attrs = m.group(1)
          class_match = re.search(r'class="([^"]*)"', attrs, flags=re.I)
          required = ['movx-v42','movx-v45','movx-v46','movx-v47','movx-v48','movx-v49','movx-v51']
          if class_match:
              classes = [c for c in class_match.group(1).split() if c not in {'movx-v43','movx-v44','movx-v50'}]
              for cls in required:
                  if cls not in classes:
                      classes.append(cls)
              attrs = attrs[:class_match.start()] + f'class="{" ".join(classes)}"' + attrs[class_match.end():]
          else:
              attrs += ' class="' + ' '.join(required) + '"'
          attrs = re.sub(r'\sdata-movx-build="[^"]*"', '', attrs)
          attrs += ' data-movx-build="v51-physics"'
          h = h[:m.start()] + '<html' + attrs + '>' + h[m.end():]

          version='51-physics'
          h = re.sub(r'href="styles\.css(?:\?[^\"]*)?"', f'href="styles.css?v={version}"', h)
          h = re.sub(r'src="projects\.js(?:\?[^\"]*)?"', f'src="projects.js?v={version}"', h)
          h = re.sub(r'src="i18n\.js(?:\?[^\"]*)?"', f'src="i18n.js?v={version}"', h)
          h = re.sub(r'src="script\.js(?:\?[^\"]*)?"', f'src="script.js?v={version}"', h)

          extra_css = f'''  <link rel="stylesheet" href="v45-immersive.css?v={version}">\n  <link rel="stylesheet" href="v46-niche.css?v={version}">\n  <link rel="stylesheet" href="v47-territories.css?v={version}">\n  <link rel="stylesheet" href="v48-spatial.css?v={version}">\n  <link rel="stylesheet" href="v49-journey.css?v={version}">\n  <link rel="stylesheet" href="v51-physics.css?v={version}">\n'''
          h = h.replace('</head>', extra_css + '</head>')
          runtime = f'''\n<script src="vendor/gsap.min.js?v={version}"></script>\n<script src="vendor/ScrollTrigger.min.js?v={version}"></script>\n<script type="module" src="v45-immersive.mjs?v={version}"></script>\n<script src="v46-niche.js?v={version}"></script>\n<script src="v47-archive-flow.js?v={version}"></script>\n<script src="v48-spatial.js?v={version}"></script>\n<script type="module" src="v49-journey.mjs?v={version}"></script>\n<script type="module" src="v51-physics.mjs?v={version}"></script>\n'''
          h = h.replace('</body>', runtime + '</body>')
          p.write_text(h, encoding='utf-8')
          PY

          cp _site/social-media.html _site/index.html
          cp _site/social-media.html _site/v51.html
          cp _site/social-media.html _site/latest.html

          test -s _site/index.html
          test -s _site/v51.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/v45-immersive.mjs
          test -s _site/v47-territories.css
          test -s _site/v48-spatial.css
          test -s _site/v49-journey.css
          test -s _site/v49-journey.mjs
          test -s _site/v51-physics.css
          test -s _site/v51-physics.mjs
          test -s _site/vendor/three.module.min.js
          test -s _site/vendor/gsap.min.js
          test -s _site/vendor/ScrollTrigger.min.js
          test -s _site/i18n.js
          test -s _site/projects.js

          ASSET_COUNT="$(find _site/assets -type f | wc -l | tr -d ' ')"
          echo "MOVX asset count: $ASSET_COUNT"
          test "$ASSET_COUNT" -ge 70

          node --check _site/script.js
          node --check _site/v45-immersive.mjs
          node --check _site/v46-niche.js
          node --check _site/v47-archive-flow.js
          node --check _site/v48-spatial.js
          node --check _site/v49-journey.mjs
          node --check _site/v51-physics.mjs
          node --check _site/i18n.js
          node --check _site/projects.js
          python3 -m py_compile patches/v37-runtime-audit.py patches/v38-runtime-audit.py

          grep -q 'class="[^"]*movx-v51' _site/index.html
          grep -q 'data-movx-build="v51-physics"' _site/index.html
          grep -q 'v51-physics.css?v=51-physics' _site/index.html
          grep -q 'v51-physics.mjs?v=51-physics' _site/index.html
          grep -q 'v51-artifact-section' _site/v51-physics.css
          grep -q 'applyBend' _site/v51-physics.mjs
          grep -q 'corridorT' _site/v51-physics.mjs
          grep -q 'hardwork-thermo-plus' _site/v51-physics.mjs
          grep -q 'CatmullRomCurve3' _site/v49-journey.mjs
          grep -q 'background:#080706!important' _site/v48-spatial.css
          grep -q 'grid-template-rows:clamp(300px,29vw,410px)' _site/v47-territories.css
          grep -q 'Rosa choque' _site/i18n.js

          ! grep -q 'v50-artifact.mjs' _site/index.html
          ! grep -q 'MOVX v43 — immersive lower-scroll controller' _site/script.js
          ! grep -q 'MOVX v42 — lower-section parallax runtime' _site/script.js
          ! grep -q 'MOVX v40 — native WebGL scroll corridor' _site/script.js
          ! grep -q 'vendor/lenis.min.js' _site/index.html

          echo "MOVX v51 validated: curved portfolio works extract from archive case and align into Process corridor"

          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          python3 -m http.server 4173 --directory _site >/tmp/movx-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/v51.html?v=51-physics',{waitUntil:'networkidle'});
          await page.waitForSelector('.v51-artifact-section',{state:'attached'});
          const snap = async (progress,path) => {
            await page.evaluate((p)=>{
              const s=document.querySelector('.v51-artifact-section');
              const top=window.scrollY+s.getBoundingClientRect().top;
              const travel=Math.max(1,s.offsetHeight-window.innerHeight);
              window.scrollTo(0,top+travel*p);
            },progress);
            await page.waitForTimeout(1400);
            await page.screenshot({path,fullPage:false});
          };
          await snap(.50,'_site/preview-v51-extraction.png');
          await snap(.78,'_site/preview-v51-handoff.png');
          await browser.close();
          NODE
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
          test -s _site/preview-v51-extraction.png
          test -s _site/preview-v51-handoff.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
