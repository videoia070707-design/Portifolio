name: Deploy MOVX Portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build canonical MOVX source
        run: npm run build
      - name: Validate desktop, mobile, cases and motion before publishing
        run: |
          npx playwright install --with-deps chromium
          python3 -m http.server 4173 --directory _site >/tmp/movx-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npm run qa
          node scripts/qa-layout.cjs
          node scripts/qa-v106.cjs
          node scripts/qa-v107.cjs
          node scripts/qa-v108.cjs
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-v108-validation
          path: _site/qa-*
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
