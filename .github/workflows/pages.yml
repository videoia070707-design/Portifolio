name: Deploy MOVX to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild optimized MOVX assets
        shell: bash
        run: |
          cat .assets/hero/part-*.b64 | tr -d '\n\r' | base64 --ignore-garbage -d > hero.webp
          cat .assets/sprite/part-*.b64 | tr -d '\n\r' | base64 --ignore-garbage -d > sprite.webp
          test -s hero.webp
          test -s sprite.webp
          file hero.webp
          file sprite.webp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
