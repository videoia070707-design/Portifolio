name: Deploy MOVX Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MOVX v36 cinematic opening
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'MOVX_Portfolio_v18*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::No MOVX source ZIP found in repository root"
            exit 1
          fi

          rm -rf _restore _site
          mkdir -p _restore _site
          unzip -q "$ZIP" -d _restore
          SOCIAL="$(find _restore -type f -name 'social-media.html' -print -quit)"
          test -n "$SOCIAL"
          ROOT="$(dirname "$SOCIAL")"
          cp -a "$ROOT"/. _site/

          if [ -s patches/v19-overrides.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v19-overrides.css >> _site/styles.css
          fi
          python3 case-order-v20.py _site/projects.js
          python3 v22-build.py _site

          if [ -s patches/v21-motion.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v21-motion.css >> _site/styles.css
          fi
          python3 - <<'PY'
          from pathlib import Path
          src = Path('patches/v21-motion.js').read_text(encoding='utf-8')
          start_token = '  /* ---------------------------------------------------------\n     Viewport motion'
          end_token = '  /* Case viewer entrance'
          if start_token in src and end_token in src:
              a = src.index(start_token)
              b = src.index(end_token)
              src = src[:a] + src[b:]
          Path('/tmp/v21-core.js').write_text(src, encoding='utf-8')
          PY
          printf '\n\n' >> _site/script.js
          cat /tmp/v21-core.js >> _site/script.js

          if [ -s patches/v22-performance.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v22-performance.css >> _site/styles.css
          fi
          python3 patches/v23-copy.py _site

          for file in \
            patches/v28-motion-safe.css \
            patches/v30-polish.css \
            patches/v31-exhibition.css \
            patches/v32-editorial-architecture.css \
            patches/v33-case-editorial.css \
            patches/v34-quiet-loud.css \
            patches/v35-narrative-chapters.css \
            patches/v36-opening-sequence.css; do
            test -s "$file"
            printf '\n\n' >> _site/styles.css
            cat "$file" >> _site/styles.css
          done

          for file in \
            patches/v30-motion-premium.js \
            patches/v31-exhibition.js \
            patches/v32-editorial-architecture.js \
            patches/v33-case-editorial.js \
            patches/v34-quiet-loud.js \
            patches/v35-narrative-chapters.js \
            patches/v36-opening-sequence.js; do
            test -s "$file"
            printf '\n\n' >> _site/script.js
            cat "$file" >> _site/script.js
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('_site/social-media.html')
          h = p.read_text(encoding='utf-8')
          h = re.sub(r'href="styles\.css(?:\?[^\"]*)?"', 'href="styles.css?v=36-opening"', h)
          h = re.sub(r'src="projects\.js(?:\?[^\"]*)?"', 'src="projects.js?v=36-opening"', h)
          h = re.sub(r'src="i18n\.js(?:\?[^\"]*)?"', 'src="i18n.js?v=36-opening"', h)
          h = re.sub(r'src="script\.js(?:\?[^\"]*)?"', 'src="script.js?v=36-opening"', h)
          p.write_text(h, encoding='utf-8')
          PY

          cp _site/social-media.html _site/index.html

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/i18n.js
          test -s _site/projects.js
          test -s _site/assets/hero/soul-of-design-hero-clean.png

          ASSET_COUNT="$(find _site/assets -type f | wc -l | tr -d ' ')"
          echo "MOVX asset count: $ASSET_COUNT"
          test "$ASSET_COUNT" -ge 70

          node --check _site/script.js
          node --check _site/i18n.js
          node --check _site/projects.js

          grep -q 'id="heroTop"' _site/index.html
          grep -q 'class="hero-index"' _site/index.html
          grep -q 'id="loopWall"' _site/index.html
          grep -q 'id="nicheGrid"' _site/index.html
          grep -q 'id="archiveGrid"' _site/index.html
          grep -q 'id="projectsList"' _site/index.html
          grep -q 'id="caseViewer"' _site/index.html
          grep -q 'window.MOVX_PROJECTS' _site/projects.js
          grep -q 'renderLoopWall' _site/script.js
          grep -q 'renderArchive' _site/script.js
          grep -q 'renderProjectList' _site/script.js
          grep -q 'renderCase' _site/script.js
          grep -q 'MOVX v30 — premium editorial motion' _site/script.js
          grep -q 'MOVX v31 — exhibition-grade interaction runtime' _site/script.js
          grep -q 'MOVX v32 — editorial architecture runtime' _site/script.js
          grep -q 'MOVX v33 — authored case-study runtime' _site/script.js
          grep -q 'MOVX v34 — quiet frame / loud work runtime' _site/script.js
          grep -q 'MOVX v35 — narrative chapter runtime' _site/script.js
          grep -q 'MOVX v36 — cinematic opening runtime' _site/script.js
          grep -q 'MOVX v36 — cinematic opening sequence' _site/styles.css
          grep -q 'v36-hero-mode' _site/styles.css
          grep -q 'v36-cinematic-handoff' _site/script.js
          grep -q 'animation-duration:68s' _site/styles.css
          grep -q 'v=36-opening' _site/index.html
          grep -q 'Rosa choque' _site/i18n.js

          ! grep -q 'MOVX v25 — unified premium motion runtime' _site/script.js
          ! grep -q 'MOVX v29 — inertial editorial motion' _site/script.js
          ! grep -q 'MOVX v29 — editorial polish' _site/styles.css
          ! grep -q 'Viewport motion — explicit WAAPI fallback' _site/script.js
          ! grep -q 'legacy animation engine disabled' _site/script.js
          ! grep -q 'vendor/gsap.min.js' _site/index.html
          ! grep -q 'vendor/lenis.min.js' _site/index.html
          ! grep -q 'social-cover-art__image{opacity:0' _site/styles.css

          echo "MOVX v36 validated: cinematic opening + editorial rail + slower living archive"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
