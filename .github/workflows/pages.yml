name: Deploy MOVX Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MOVX v93 release convergence + visual QA
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="93-release-convergence"
          BUILD="v93-release-convergence"
          ZIP="$(find . -maxdepth 1 -type f -name 'MOVX_Portfolio_v18*.zip' -print -quit)"
          test -n "$ZIP" || { echo "::error::No MOVX source ZIP found"; exit 1; }

          rm -rf _restore _site node_modules
          mkdir -p _restore _site
          unzip -q "$ZIP" -d _restore
          SOCIAL="$(find _restore -type f -name 'social-media.html' -print -quit)"
          test -n "$SOCIAL"
          ROOT="$(dirname "$SOCIAL")"
          cp -a "$ROOT"/. _site/

          if [ -s patches/v19-overrides.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v19-overrides.css >> _site/styles.css
          fi
          python3 case-order-v20.py _site/projects.js
          python3 v22-build.py _site
          if [ -s patches/v22-performance.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v22-performance.css >> _site/styles.css
          fi
          python3 patches/v23-copy.py _site

          for file in \
            patches/v28-motion-safe.css \
            patches/v30-polish.css \
            patches/v31-exhibition.css \
            patches/v32-editorial-architecture.css \
            patches/v33-case-editorial.css \
            patches/v34-quiet-loud.css \
            patches/v35-narrative-chapters.css \
            patches/v36-opening-sequence.css \
            patches/v37-performance-editorial.css \
            patches/v38-selected-cases.css \
            patches/v39-depth-motion.css \
            patches/v41-project-transitions.css \
            patches/v42-visual-recovery.css; do
            test -s "$file"
            printf '\n\n' >> _site/styles.css
            cat "$file" >> _site/styles.css
          done

          for file in \
            patches/v30-motion-premium.js \
            patches/v31-exhibition.js \
            patches/v32-editorial-architecture.js \
            patches/v33-case-editorial.js \
            patches/v34-quiet-loud.js \
            patches/v35-narrative-chapters.js \
            patches/v36-opening-sequence.js \
            patches/v37-performance-editorial.js \
            patches/v38-selected-cases.js \
            patches/v39-depth-motion.js \
            patches/v41-project-transitions.js; do
            test -s "$file"
            printf '\n\n' >> _site/script.js
            cat "$file" >> _site/script.js
          done

          python3 patches/v37-runtime-audit.py _site
          python3 patches/v38-runtime-audit.py _site

          npm install --silent --no-progress --no-audit --no-fund --no-save three@0.180.0 gsap@3.13.0 playwright@1.55.0
          mkdir -p _site/vendor
          cp node_modules/three/build/three.module.min.js _site/vendor/three.module.min.js
          cp node_modules/three/build/three.core.min.js _site/vendor/three.core.min.js
          cp node_modules/gsap/dist/gsap.min.js _site/vendor/gsap.min.js
          cp node_modules/gsap/dist/ScrollTrigger.min.js _site/vendor/ScrollTrigger.min.js

          cp patches/v45-immersive-continuity.css _site/v45-immersive.css
          cp patches/v45-immersive-continuity.mjs _site/v45-immersive.mjs
          cp patches/v46-niche-recovery.css _site/v46-niche.css
          cp patches/v46-niche-recovery.js _site/v46-niche.js
          cp patches/v47-clean-territories.css _site/v47-territories.css
          cp patches/v47-archive-flow.js _site/v47-archive-flow.js
          cp patches/v48-spatial-polish.css _site/v48-spatial.css
          cp patches/v48-spatial-polish.js _site/v48-spatial.js
          cp patches/v49-journey-continuity.css _site/v49-journey.css
          cp patches/v49-journey-continuity.mjs _site/v49-journey.mjs
          cp patches/v52-process-architecture.css _site/v52-architecture.css
          cp patches/v52-process-architecture.mjs _site/v52-architecture.mjs
          cp patches/v54-native-artwork-portal.css _site/v54-portal.css
          cp patches/v54-native-artwork-portal.mjs _site/v54-portal.mjs
          cp patches/v55-process-camera.css _site/v55-process.css
          cp patches/v55-process-camera.mjs _site/v55-process.mjs
          cp patches/v56-contact-handoff.css _site/v56-contact.css
          cp patches/v56-contact-handoff.js _site/v56-contact.js
          cp patches/v57-motion-integrity.css _site/v57-integrity.css
          cp patches/v57-motion-integrity.js _site/v57-integrity.js
          cp patches/v74-accessibility.js _site/v74-accessibility.js
          cp patches/v85-reference-direction.css _site/v85-reference.css
          cp patches/v86-signature-motion.css _site/v86-signature.css
          cp patches/v87-editorial-continuity.css _site/v87-editorial.css
          cp patches/v88-chapter-signature.css _site/v88-chapter.css
          cp patches/v88-chapter-signature.js _site/v88-chapter.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          build='v93-release-convergence'
          version='93-release-convergence'

          # v57 and v74 keep their historical filenames/APIs, but the production
          # identity must describe the release that actually reaches Pages.
          for name in ('v57-integrity.js','v74-accessibility.js'):
              p=Path('_site')/name
              text=p.read_text(encoding='utf-8').replace('v74-accessible-editorial',build)
              p.write_text(text,encoding='utf-8')

          p=Path('_site/social-media.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'<html([^>]*)>',h,flags=re.I)
          if not m: raise SystemExit('No <html> element found')
          attrs=m.group(1)
          cm=re.search(r'class="([^"]*)"',attrs,flags=re.I)
          required=[
              'movx-v42','movx-v45','movx-v46','movx-v47','movx-v48','movx-v49',
              'movx-v52','movx-v54','movx-v55','movx-v56','movx-v57',
              'movx-v84','movx-v85','movx-v86','movx-v87','movx-v88'
          ]
          retired={'movx-v43','movx-v44','movx-v50','movx-v51','movx-v53'}
          if cm:
              classes=[c for c in cm.group(1).split() if c not in retired]
              for cls in required:
                  if cls not in classes: classes.append(cls)
              attrs=attrs[:cm.start()]+f'class="{" ".join(classes)}"'+attrs[cm.end():]
          else:
              attrs+=' class="'+' '.join(required)+'"'
          attrs=re.sub(r'\sdata-movx-build="[^"]*"','',attrs)
          attrs+=' data-movx-build="'+build+'" data-movx-design="v90-editorial-rhythm"'
          h=h[:m.start()]+'<html'+attrs+'>'+h[m.end():]

          h=re.sub(r'href="styles\.css(?:\?[^\"]*)?"',f'href="styles.css?v={version}"',h)
          h=re.sub(r'src="projects\.js(?:\?[^\"]*)?"',f'src="projects.js?v={version}"',h)
          h=re.sub(r'src="i18n\.js(?:\?[^\"]*)?"',f'src="i18n.js?v={version}"',h)
          h=re.sub(r'src="script\.js(?:\?[^\"]*)?"',f'src="script.js?v={version}"',h)

          extra_css=f'''  <link rel="stylesheet" href="v45-immersive.css?v={version}">\n  <link rel="stylesheet" href="v46-niche.css?v={version}">\n  <link rel="stylesheet" href="v47-territories.css?v={version}">\n  <link rel="stylesheet" href="v48-spatial.css?v={version}">\n  <link rel="stylesheet" href="v49-journey.css?v={version}">\n  <link rel="stylesheet" href="v52-architecture.css?v={version}">\n  <link rel="stylesheet" href="v54-portal.css?v={version}">\n  <link rel="stylesheet" href="v55-process.css?v={version}">\n  <link rel="stylesheet" href="v56-contact.css?v={version}">\n  <link rel="stylesheet" href="v57-integrity.css?v={version}">\n  <link rel="stylesheet" href="v85-reference.css?v={version}">\n  <link rel="stylesheet" href="v86-signature.css?v={version}">\n  <link rel="stylesheet" href="v87-editorial.css?v={version}">\n  <link rel="stylesheet" href="v88-chapter.css?v={version}">\n'''
          h=h.replace('</head>',extra_css+'</head>')

          runtime=f'''\n<script src="vendor/gsap.min.js?v={version}"></script>\n<script src="vendor/ScrollTrigger.min.js?v={version}"></script>\n<script type="module" src="v45-immersive.mjs?v={version}"></script>\n<script src="v46-niche.js?v={version}"></script>\n<script src="v47-archive-flow.js?v={version}"></script>\n<script src="v48-spatial.js?v={version}"></script>\n<script type="module" src="v49-journey.mjs?v={version}"></script>\n<script type="module" src="v52-architecture.mjs?v={version}"></script>\n<script type="module" src="v54-portal.mjs?v={version}"></script>\n<script type="module" src="v55-process.mjs?v={version}"></script>\n<script src="v56-contact.js?v={version}"></script>\n<script src="v57-integrity.js?v={version}"></script>\n<script src="v74-accessibility.js?v={version}"></script>\n<script src="v88-chapter.js?v={version}"></script>\n'''
          h=h.replace('</body>',runtime+'</body>')
          p.write_text(h,encoding='utf-8')
          PY

          cp _site/social-media.html _site/index.html
          cp _site/social-media.html _site/v57.html
          cp _site/social-media.html _site/v74.html
          cp _site/social-media.html _site/v93.html
          cp _site/social-media.html _site/latest.html

          for file in \
            _site/index.html _site/v93.html _site/latest.html \
            _site/v55-process.css _site/v55-process.mjs \
            _site/v56-contact.css _site/v56-contact.js \
            _site/v57-integrity.css _site/v57-integrity.js \
            _site/v74-accessibility.js \
            _site/v85-reference.css _site/v86-signature.css \
            _site/v87-editorial.css _site/v88-chapter.css _site/v88-chapter.js; do
            test -s "$file"
          done

          ASSET_COUNT="$(find _site/assets -type f | wc -l | tr -d ' ')"
          echo "MOVX asset count: $ASSET_COUNT"
          test "$ASSET_COUNT" -ge 70

          node --check _site/script.js
          node --check _site/v45-immersive.mjs
          node --check _site/v46-niche.js
          node --check _site/v47-archive-flow.js
          node --check _site/v48-spatial.js
          node --check _site/v49-journey.mjs
          node --check _site/v52-architecture.mjs
          node --check _site/v54-portal.mjs
          node --check _site/v55-process.mjs
          node --check _site/v56-contact.js
          node --check _site/v57-integrity.js
          node --check _site/v74-accessibility.js
          node --check _site/v88-chapter.js
          node --check _site/i18n.js
          node --check _site/projects.js
          python3 -m py_compile patches/v37-runtime-audit.py patches/v38-runtime-audit.py

          grep -q 'class="[^"]*movx-v88' _site/index.html
          grep -q 'class="[^"]*movx-v86' _site/index.html
          grep -q 'data-movx-build="v93-release-convergence"' _site/index.html
          grep -q 'data-movx-design="v90-editorial-rhythm"' _site/index.html
          grep -q 'v85-reference.css?v=93-release-convergence' _site/index.html
          grep -q 'v86-signature.css?v=93-release-convergence' _site/index.html
          grep -q 'v87-editorial.css?v=93-release-convergence' _site/index.html
          grep -q 'v88-chapter.css?v=93-release-convergence' _site/index.html
          grep -q 'v88-chapter.js?v=93-release-convergence' _site/index.html
          grep -q "buildId='v93-release-convergence'" _site/v57-integrity.js
          grep -q "dataset.movxRelease='v93-release-convergence'" _site/v74-accessibility.js
          grep -q '__MOVX_V57_AUDIT__' _site/v57-integrity.js
          grep -q 'MOVX v90' _site/v88-chapter.css
          grep -q 'movxChapterSignature' _site/v88-chapter.js
          grep -q 'dataset.v56Phase' _site/v56-contact.js
          grep -q 'Rosa choque' _site/i18n.js
          ! grep -q 'vendor/lenis.min.js' _site/index.html

          echo "MOVX v93 static validation passed"

          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          python3 -m http.server 4173 --directory _site >/tmp/movx-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const release='v93-release-convergence';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          const pageErrors=[];
          page.on('pageerror',err=>pageErrors.push(String(err)));
          await page.goto('http://127.0.0.1:4173/v93.html?v=93-release-convergence',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__MOVX_V57_AUDIT__,null,{timeout:20000});
          await page.waitForFunction(r=>document.documentElement.dataset.movxRelease===r,release,{timeout:10000});
          await page.waitForFunction(()=>document.documentElement.dataset.movxChapterSignature==='v88-fold-continuity-single-owner',null,{timeout:10000});
          await page.addStyleTag({content:'html,body{scroll-behavior:auto!important}'});

          const report={release,desktop:[],process:[],mobile:[],case:[],accessibility:[],signature:{},pageErrors};
          const signature=await page.evaluate(()=>({
            build:document.documentElement.dataset.movxBuild,
            release:document.documentElement.dataset.movxRelease,
            design:document.documentElement.dataset.movxDesign,
            chapter:document.documentElement.dataset.movxChapterSignature,
            classes:[...document.documentElement.classList],
            foldMarks:document.querySelectorAll('.v88-fold-mark').length,
            styles:[...document.styleSheets].map(s=>s.href||'').filter(Boolean)
          }));
          report.signature=signature;
          for(const cls of ['movx-v84','movx-v85','movx-v86','movx-v87','movx-v88']){
            if(!signature.classes.includes(cls)) throw new Error(`Missing production class ${cls}`);
          }
          if(signature.build!==release||signature.release!==release) throw new Error('Release identity mismatch '+JSON.stringify(signature));
          if(signature.foldMarks<2) throw new Error('v88 fold signature did not mount');
          for(const sheet of ['v85-reference.css','v86-signature.css','v87-editorial.css','v88-chapter.css']){
            if(!signature.styles.some(x=>x.includes(sheet))) throw new Error(`Missing production stylesheet ${sheet}`);
          }

          async function sample(label){
            await page.waitForTimeout(780);
            const audit=await page.evaluate(()=>window.__MOVX_V57_AUDIT__.inspect());
            report.desktop.push({label,...audit});
            if(audit.build!==release) throw new Error(`${label}: wrong release build ${audit.build}`);
            if(audit.overflow>2) throw new Error(`${label}: horizontal overflow ${audit.overflow}`);
            const clips=audit.visibleTextIssues.filter(x=>x.type==='horizontal-clip');
            if(clips.length) throw new Error(`${label}: clipped text ${JSON.stringify(clips.slice(0,3))}`);
            return audit;
          }
          async function sectionShot(selector,name,offset=.12){
            await page.evaluate(({selector,offset})=>{
              const el=document.querySelector(selector); if(!el) throw new Error('Missing '+selector);
              const top=window.scrollY+el.getBoundingClientRect().top;
              window.scrollTo(0,Math.max(0,top-window.innerHeight*offset));
            },{selector,offset});
            const audit=await sample(name);
            await page.screenshot({path:`_site/qa-v93-${name}.png`,fullPage:false});
            return audit;
          }

          await page.screenshot({path:'_site/qa-v93-00-home.png',fullPage:false});
          await sample('00-home');
          for(const [selector,name,offset] of [
            ['#livingArchive','01-living-archive',.11],
            ['#nicheIndex','02-territories',.10],
            ['#archiveControls','03-directory',.08],
            ['.projects-list','04-selected-cases',.08],
            ['#about','05-about',.12],
            ['#services','06-services',.10]
          ]) await sectionShot(selector,name,offset);

          await page.waitForSelector('.v55-process-journey',{state:'attached',timeout:15000});
          for(const progress of [.08,.34,.62,.88]){
            await page.evaluate(progress=>{
              const s=document.querySelector('.v55-process-journey');
              const top=window.scrollY+s.getBoundingClientRect().top;
              const travel=Math.max(1,s.offsetHeight-window.innerHeight);
              window.scrollTo(0,top+travel*progress);
            },progress);
            await page.waitForTimeout(850);
            const state=await page.evaluate(()=>({
              audit:window.__MOVX_V57_AUDIT__.inspect(),
              current:document.querySelector('#process .process-list li.v55-current')?.innerText||''
            }));
            report.process.push({progress,...state});
            if(state.audit.overflow>2) throw new Error(`process ${progress}: overflow`);
            if(!state.current.trim()) throw new Error(`process ${progress}: missing active step`);
          }

          await sectionShot('#contact','07-contact',.08);
          const v90State=await page.evaluate(()=>({
            contactBackground:getComputedStyle(document.querySelector('#contact')).backgroundColor,
            chapter:document.documentElement.dataset.movxCurrentChapter||'',
            territoryColumns:[...document.querySelectorAll('#nicheGrid>.niche-card')].slice(0,3).map(el=>getComputedStyle(el).gridColumnStart)
          }));
          report.desktop.push({label:'v90-style-state',...v90State});
          if(v90State.contactBackground!=='rgb(5, 5, 5)') throw new Error('v90 contact art direction is not active '+JSON.stringify(v90State));

          await page.evaluate(()=>window.scrollTo(0,0));
          const keyboardOpener=page.locator('[data-open-project][role="button"][tabindex="0"]').first();
          await keyboardOpener.waitFor({state:'visible',timeout:10000});
          await keyboardOpener.evaluate(el=>el.dataset.v93QaOpener='1');
          await keyboardOpener.focus();
          await page.keyboard.press('Enter');
          await page.waitForSelector('#caseViewer.open',{state:'visible',timeout:8000});
          await page.waitForTimeout(220);
          const keyboardOpen=await page.evaluate(()=>({
            release:document.documentElement.dataset.movxRelease||'',
            modal:document.querySelector('#caseViewer').getAttribute('aria-modal'),
            hidden:document.querySelector('#caseViewer').getAttribute('aria-hidden'),
            active:document.activeElement?.id||document.activeElement?.className||''
          }));
          if(keyboardOpen.release!==release||keyboardOpen.modal!=='true'||keyboardOpen.hidden!=='false'||keyboardOpen.active!=='caseClose'){
            throw new Error('Keyboard case open failed '+JSON.stringify(keyboardOpen));
          }
          await page.screenshot({path:'_site/qa-v93-08-case-hero.png',fullPage:false});
          await page.keyboard.press('Escape');
          await page.waitForFunction(()=>!document.querySelector('#caseViewer').classList.contains('open'),null,{timeout:5000});
          await page.waitForTimeout(80);
          const keyboardClose=await page.evaluate(()=>({
            hidden:document.querySelector('#caseViewer').getAttribute('aria-hidden'),
            restored:document.activeElement?.dataset?.v93QaOpener==='1'
          }));
          if(keyboardClose.hidden!=='true'||!keyboardClose.restored) throw new Error('Keyboard focus restoration failed '+JSON.stringify(keyboardClose));
          report.accessibility.push({name:'keyboard-case-flow',open:keyboardOpen,close:keyboardClose});

          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const mobileErrors=[];
          mobile.on('pageerror',err=>mobileErrors.push(String(err)));
          await mobile.goto('http://127.0.0.1:4173/v93.html?v=93-release-convergence',{waitUntil:'networkidle'});
          await mobile.waitForFunction(()=>window.__MOVX_V57_AUDIT__,null,{timeout:20000});
          await mobile.waitForFunction(r=>document.documentElement.dataset.movxRelease===r,release,{timeout:10000});
          await mobile.addStyleTag({content:'html,body{scroll-behavior:auto!important}'});

          async function mobileShot(selector,name){
            await mobile.evaluate(selector=>{
              const el=document.querySelector(selector); if(!el) throw new Error('Missing '+selector);
              const top=window.scrollY+el.getBoundingClientRect().top;
              window.scrollTo(0,Math.max(0,top-72));
            },selector);
            await mobile.waitForTimeout(620);
            const state=await mobile.evaluate(()=>window.__MOVX_V57_AUDIT__.inspect());
            report.mobile.push({name,...state});
            if(state.overflow>2) throw new Error(`mobile ${name}: overflow ${state.overflow}`);
            await mobile.screenshot({path:`_site/qa-v93-mobile-${name}.png`,fullPage:false});
          }

          await mobile.screenshot({path:'_site/qa-v93-mobile-00-home.png',fullPage:false});
          for(const [selector,name] of [
            ['#livingArchive','01-living-archive'],
            ['#nicheIndex','02-territories'],
            ['.projects-list','03-selected-cases'],
            ['#about','04-about'],
            ['#services','05-services'],
            ['#process','06-process'],
            ['#contact','07-contact']
          ]) await mobileShot(selector,name);

          const mobileProcess=await mobile.evaluate(()=>({
            rows:[...document.querySelectorAll('#process .process-list li')].map(el=>({position:getComputedStyle(el).position,opacity:parseFloat(getComputedStyle(el).opacity||'1')}))
          }));
          if(mobileProcess.rows.some(x=>x.position==='absolute'||x.opacity<.88)) throw new Error('Mobile Process readability regression '+JSON.stringify(mobileProcess));
          if(pageErrors.length) throw new Error('Desktop page errors: '+pageErrors.join(' | '));
          if(mobileErrors.length) throw new Error('Mobile page errors: '+mobileErrors.join(' | '));

          await writeFile('_site/qa-v93-report.json',JSON.stringify(report,null,2));
          await mobile.close();
          await browser.close();
          NODE

          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
          test -s _site/qa-v93-report.json
          test -s _site/qa-v93-00-home.png
          test -s _site/qa-v93-07-contact.png
          test -s _site/qa-v93-08-case-hero.png
          test -s _site/qa-v93-mobile-07-contact.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
