name: Deploy MOVX Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MOVX v28 safe premium motion
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'MOVX_Portfolio_v18*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::No MOVX source ZIP found in repository root"
            exit 1
          fi

          rm -rf _restore _site
          mkdir -p _restore _site
          unzip -q "$ZIP" -d _restore
          SOCIAL="$(find _restore -type f -name 'social-media.html' -print -quit)"
          test -n "$SOCIAL"
          ROOT="$(dirname "$SOCIAL")"
          cp -a "$ROOT"/. _site/

          # Keep the proven design/data/copy refinements.
          if [ -s patches/v19-overrides.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v19-overrides.css >> _site/styles.css
          fi
          python3 case-order-v20.py _site/projects.js
          python3 v22-build.py _site

          # Stable content-independent conveyor and reveal engine.
          if [ -s patches/v21-motion.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v21-motion.css >> _site/styles.css
          fi
          if [ -s patches/v21-motion.js ]; then
            printf '\n\n' >> _site/script.js
            cat patches/v21-motion.js >> _site/script.js
          fi

          if [ -s patches/v22-performance.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v22-performance.css >> _site/styles.css
          fi
          python3 patches/v23-copy.py _site

          # V28 is additive and fail-open: no third-party runtime and no content starts hidden.
          test -s patches/v28-motion-safe.css
          test -s patches/v28-motion-safe.js
          printf '\n\n' >> _site/styles.css
          cat patches/v28-motion-safe.css >> _site/styles.css
          printf '\n\n' >> _site/script.js
          cat patches/v28-motion-safe.js >> _site/script.js

          # Force fresh browser requests after the stable recovery.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/social-media.html')
          h = p.read_text(encoding='utf-8')
          h = h.replace('href="styles.css"', 'href="styles.css?v=28-safe"')
          h = h.replace('src="projects.js"', 'src="projects.js?v=28-safe"')
          h = h.replace('src="i18n.js"', 'src="i18n.js?v=28-safe"')
          h = h.replace('src="script.js"', 'src="script.js?v=28-safe"')
          p.write_text(h, encoding='utf-8')
          PY

          cp _site/social-media.html _site/index.html

          # Hard validation: content mounts and data remain primary; motion is optional enhancement.
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/script.js
          test -s _site/i18n.js
          test -s _site/projects.js
          test -s _site/assets/hero/soul-of-design-hero-clean.png

          ASSET_COUNT="$(find _site/assets -type f | wc -l | tr -d ' ')"
          echo "MOVX asset count: $ASSET_COUNT"
          test "$ASSET_COUNT" -ge 70

          node --check _site/script.js
          node --check _site/i18n.js
          node --check _site/projects.js

          grep -q 'id="loopWall"' _site/index.html
          grep -q 'id="nicheGrid"' _site/index.html
          grep -q 'id="archiveGrid"' _site/index.html
          grep -q 'id="projectsList"' _site/index.html
          grep -q 'window.MOVX_PROJECTS' _site/projects.js
          grep -q 'renderLoopWall' _site/script.js
          grep -q 'renderArchive' _site/script.js
          grep -q 'renderProjectList' _site/script.js
          grep -q 'MOVX v21 — resilient motion engine' _site/script.js
          grep -q 'Shared scroll impulse' _site/script.js
          grep -q 'MOVX v28 — safe premium motion layer' _site/script.js
          grep -q 'html.movx-v28' _site/styles.css
          grep -q 'v28-hero-overlay' _site/script.js
          grep -q 'v28-about-x' _site/script.js
          grep -q 'v28-process' _site/script.js
          grep -q 'Tecnologia & Inovação' _site/i18n.js
          grep -q 'Direção que transforma repertório' _site/i18n.js

          ! grep -q 'MOVX v25 — unified premium motion runtime' _site/script.js
          ! grep -q 'legacy animation engine disabled' _site/script.js
          ! grep -q 'vendor/gsap.min.js' _site/index.html
          ! grep -q 'vendor/lenis.min.js' _site/index.html
          ! grep -q 'social-cover-art__image{opacity:0' _site/styles.css

          echo "MOVX v28 validated: full content + native premium motion + fail-open architecture"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
