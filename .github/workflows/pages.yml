name: Deploy MOVX Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure FFmpeg for optimized media
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Build optimized MOVX source
        run: npm run build

      - name: Enforce performance budgets
        run: python3 scripts/qa-performance.py

      - name: Store immutable build for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: movx-built-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  qa-desktop-3d:
    name: QA desktop 3D
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate six real GLBs and desktop framing
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/movx-desktop-3d.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npm run qa:v324

      - name: Save desktop 3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-qa-desktop-3d
          path: |
            _site/qa-v324-*
            /tmp/movx-desktop-3d.log
          if-no-files-found: warn
          retention-days: 7

  qa-mobile-3d:
    name: QA mobile 3D
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate touch/mobile WebGL policy
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/movx-mobile-3d.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npm run qa:v332

      - name: Save mobile 3D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-qa-mobile-3d
          path: |
            _site/qa-v332-*
            /tmp/movx-mobile-3d.log
          if-no-files-found: warn
          retention-days: 7

  qa-contracts:
    name: QA runtime contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate runtime and storyboard contracts
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/movx-contracts.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/qa-v322-runtime.cjs
          node scripts/qa-v321-production.cjs
          node scripts/qa-v137-reference.cjs
          node scripts/qa-v136.cjs

      - name: Save contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-qa-contracts
          path: |
            _site/qa-v322-*
            _site/qa-v321-*
            _site/qa-v138-*
            /tmp/movx-contracts.log
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Publish Pages
    needs: [build, qa-desktop-3d, qa-mobile-3d, qa-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore validated build
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
