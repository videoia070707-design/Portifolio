name: Deploy MOVX Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MOVX v57 motion integrity + full visual QA
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f -name 'MOVX_Portfolio_v18*.zip' -print -quit)"
          test -n "$ZIP" || { echo "::error::No MOVX source ZIP found"; exit 1; }

          rm -rf _restore _site node_modules
          mkdir -p _restore _site
          unzip -q "$ZIP" -d _restore
          SOCIAL="$(find _restore -type f -name 'social-media.html' -print -quit)"
          test -n "$SOCIAL"
          ROOT="$(dirname "$SOCIAL")"
          cp -a "$ROOT"/. _site/

          if [ -s patches/v19-overrides.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v19-overrides.css >> _site/styles.css
          fi
          python3 case-order-v20.py _site/projects.js
          python3 v22-build.py _site
          if [ -s patches/v22-performance.css ]; then
            printf '\n\n' >> _site/styles.css
            cat patches/v22-performance.css >> _site/styles.css
          fi
          python3 patches/v23-copy.py _site

          for file in \
            patches/v28-motion-safe.css \
            patches/v30-polish.css \
            patches/v31-exhibition.css \
            patches/v32-editorial-architecture.css \
            patches/v33-case-editorial.css \
            patches/v34-quiet-loud.css \
            patches/v35-narrative-chapters.css \
            patches/v36-opening-sequence.css \
            patches/v37-performance-editorial.css \
            patches/v38-selected-cases.css \
            patches/v39-depth-motion.css \
            patches/v41-project-transitions.css \
            patches/v42-visual-recovery.css; do
            test -s "$file"
            printf '\n\n' >> _site/styles.css
            cat "$file" >> _site/styles.css
          done

          for file in \
            patches/v30-motion-premium.js \
            patches/v31-exhibition.js \
            patches/v32-editorial-architecture.js \
            patches/v33-case-editorial.js \
            patches/v34-quiet-loud.js \
            patches/v35-narrative-chapters.js \
            patches/v36-opening-sequence.js \
            patches/v37-performance-editorial.js \
            patches/v38-selected-cases.js \
            patches/v39-depth-motion.js \
            patches/v41-project-transitions.js; do
            test -s "$file"
            printf '\n\n' >> _site/script.js
            cat "$file" >> _site/script.js
          done

          python3 patches/v37-runtime-audit.py _site
          python3 patches/v38-runtime-audit.py _site

          npm install --silent --no-progress --no-audit --no-fund --no-save three@0.180.0 gsap@3.13.0 playwright@1.55.0
          mkdir -p _site/vendor
          cp node_modules/three/build/three.module.min.js _site/vendor/three.module.min.js
          cp node_modules/three/build/three.core.min.js _site/vendor/three.core.min.js
          cp node_modules/gsap/dist/gsap.min.js _site/vendor/gsap.min.js
          cp node_modules/gsap/dist/ScrollTrigger.min.js _site/vendor/ScrollTrigger.min.js

          cp patches/v45-immersive-continuity.css _site/v45-immersive.css
          cp patches/v45-immersive-continuity.mjs _site/v45-immersive.mjs
          cp patches/v46-niche-recovery.css _site/v46-niche.css
          cp patches/v46-niche-recovery.js _site/v46-niche.js
          cp patches/v47-clean-territories.css _site/v47-territories.css
          cp patches/v47-archive-flow.js _site/v47-archive-flow.js
          cp patches/v48-spatial-polish.css _site/v48-spatial.css
          cp patches/v48-spatial-polish.js _site/v48-spatial.js
          cp patches/v49-journey-continuity.css _site/v49-journey.css
          cp patches/v49-journey-continuity.mjs _site/v49-journey.mjs
          cp patches/v52-process-architecture.css _site/v52-architecture.css
          cp patches/v52-process-architecture.mjs _site/v52-architecture.mjs
          cp patches/v54-native-artwork-portal.css _site/v54-portal.css
          cp patches/v54-native-artwork-portal.mjs _site/v54-portal.mjs
          cp patches/v55-process-camera.css _site/v55-process.css
          cp patches/v55-process-camera.mjs _site/v55-process.mjs
          cp patches/v56-contact-handoff.css _site/v56-contact.css
          cp patches/v56-contact-handoff.js _site/v56-contact.js
          cp patches/v57-motion-integrity.css _site/v57-integrity.css
          cp patches/v57-motion-integrity.js _site/v57-integrity.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('_site/social-media.html')
          h=p.read_text(encoding='utf-8')
          m=re.search(r'<html([^>]*)>',h,flags=re.I)
          if not m: raise SystemExit('No <html> element found')
          attrs=m.group(1)
          cm=re.search(r'class="([^"]*)"',attrs,flags=re.I)
          required=['movx-v42','movx-v45','movx-v46','movx-v47','movx-v48','movx-v49','movx-v52','movx-v54','movx-v55','movx-v56','movx-v57']
          if cm:
              classes=[c for c in cm.group(1).split() if c not in {'movx-v43','movx-v44','movx-v50','movx-v51','movx-v53'}]
              for cls in required:
                  if cls not in classes: classes.append(cls)
              attrs=attrs[:cm.start()]+f'class="{" ".join(classes)}"'+attrs[cm.end():]
          else:
              attrs+=' class="'+' '.join(required)+'"'
          attrs=re.sub(r'\sdata-movx-build="[^"]*"','',attrs)
          attrs+=' data-movx-build="v57-motion-integrity"'
          h=h[:m.start()]+'<html'+attrs+'>'+h[m.end():]

          version='57-motion-integrity'
          h=re.sub(r'href="styles\.css(?:\?[^\"]*)?"',f'href="styles.css?v={version}"',h)
          h=re.sub(r'src="projects\.js(?:\?[^\"]*)?"',f'src="projects.js?v={version}"',h)
          h=re.sub(r'src="i18n\.js(?:\?[^\"]*)?"',f'src="i18n.js?v={version}"',h)
          h=re.sub(r'src="script\.js(?:\?[^\"]*)?"',f'src="script.js?v={version}"',h)

          extra_css=f'''  <link rel="stylesheet" href="v45-immersive.css?v={version}">\n  <link rel="stylesheet" href="v46-niche.css?v={version}">\n  <link rel="stylesheet" href="v47-territories.css?v={version}">\n  <link rel="stylesheet" href="v48-spatial.css?v={version}">\n  <link rel="stylesheet" href="v49-journey.css?v={version}">\n  <link rel="stylesheet" href="v52-architecture.css?v={version}">\n  <link rel="stylesheet" href="v54-portal.css?v={version}">\n  <link rel="stylesheet" href="v55-process.css?v={version}">\n  <link rel="stylesheet" href="v56-contact.css?v={version}">\n  <link rel="stylesheet" href="v57-integrity.css?v={version}">\n'''
          h=h.replace('</head>',extra_css+'</head>')
          runtime=f'''\n<script src="vendor/gsap.min.js?v={version}"></script>\n<script src="vendor/ScrollTrigger.min.js?v={version}"></script>\n<script type="module" src="v45-immersive.mjs?v={version}"></script>\n<script src="v46-niche.js?v={version}"></script>\n<script src="v47-archive-flow.js?v={version}"></script>\n<script src="v48-spatial.js?v={version}"></script>\n<script type="module" src="v49-journey.mjs?v={version}"></script>\n<script type="module" src="v52-architecture.mjs?v={version}"></script>\n<script type="module" src="v54-portal.mjs?v={version}"></script>\n<script type="module" src="v55-process.mjs?v={version}"></script>\n<script src="v56-contact.js?v={version}"></script>\n<script src="v57-integrity.js?v={version}"></script>\n'''
          h=h.replace('</body>',runtime+'</body>')
          p.write_text(h,encoding='utf-8')
          PY

          cp _site/social-media.html _site/index.html
          cp _site/social-media.html _site/v57.html
          cp _site/social-media.html _site/latest.html

          test -s _site/index.html
          test -s _site/v57.html
          test -s _site/v55-process.css
          test -s _site/v55-process.mjs
          test -s _site/v56-contact.css
          test -s _site/v56-contact.js
          test -s _site/v57-integrity.css
          test -s _site/v57-integrity.js
          test -s _site/vendor/three.module.min.js
          test -s _site/vendor/three.core.min.js

          ASSET_COUNT="$(find _site/assets -type f | wc -l | tr -d ' ')"
          echo "MOVX asset count: $ASSET_COUNT"
          test "$ASSET_COUNT" -ge 70

          node --check _site/script.js
          node --check _site/v45-immersive.mjs
          node --check _site/v46-niche.js
          node --check _site/v47-archive-flow.js
          node --check _site/v48-spatial.js
          node --check _site/v49-journey.mjs
          node --check _site/v52-architecture.mjs
          node --check _site/v54-portal.mjs
          node --check _site/v55-process.mjs
          node --check _site/v56-contact.js
          node --check _site/v57-integrity.js
          node --check _site/i18n.js
          node --check _site/projects.js
          python3 -m py_compile patches/v37-runtime-audit.py patches/v38-runtime-audit.py

          grep -q 'class="[^"]*movx-v57' _site/index.html
          grep -q 'data-movx-build="v57-motion-integrity"' _site/index.html
          grep -q 'v57-integrity.css?v=57-motion-integrity' _site/index.html
          grep -q 'v57-integrity.js?v=57-motion-integrity' _site/index.html
          grep -q '__MOVX_V57_AUDIT__' _site/v57-integrity.js
          grep -q 'const z=-distance\*255' _site/v55-process.mjs
          grep -q 'dataset.v56Phase' _site/v56-contact.js
          grep -q 'Rosa choque' _site/i18n.js
          ! grep -q 'vendor/lenis.min.js' _site/index.html

          echo "MOVX v57 static validation passed"

          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          python3 -m http.server 4173 --directory _site >/tmp/movx-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          const pageErrors=[];
          page.on('pageerror',err=>pageErrors.push(String(err)));
          await page.goto('http://127.0.0.1:4173/v57.html?v=57-motion-integrity',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.__MOVX_V57_AUDIT__,null,{timeout:20000});
          await page.addStyleTag({content:'html,body{scroll-behavior:auto!important}'});
          const report={desktop:[],process:[],mobile:[],case:[],pageErrors};

          async function sample(label){
            await page.waitForTimeout(850);
            const audit=await page.evaluate(()=>window.__MOVX_V57_AUDIT__.inspect());
            report.desktop.push({label,...audit});
            if(audit.overflow>2) throw new Error(`${label}: horizontal overflow ${audit.overflow}`);
            const clips=audit.visibleTextIssues.filter(x=>x.type==='horizontal-clip');
            if(clips.length) throw new Error(`${label}: clipped heading ${JSON.stringify(clips.slice(0,3))}`);
            return audit;
          }
          async function sectionShot(selector,name,offset=.12){
            await page.evaluate(({selector,offset})=>{
              const el=document.querySelector(selector); if(!el) throw new Error('Missing '+selector);
              const top=window.scrollY+el.getBoundingClientRect().top;
              window.scrollTo(0,Math.max(0,top-window.innerHeight*offset));
            },{selector,offset});
            const audit=await sample(name);
            await page.screenshot({path:`_site/qa-v57-${name}.png`,fullPage:false});
            return audit;
          }

          await page.screenshot({path:'_site/qa-v57-00-home.png',fullPage:false});
          await sample('00-home');
          for(const [selector,name,offset] of [
            ['#livingArchive','01-living-archive',.11],
            ['#nicheIndex','02-territories',.1],
            ['#archiveControls','03-archive',.08],
            ['.projects-list','04-selected',.08],
            ['#about','05-about',.12],
            ['#services','06-services',.1]
          ]) await sectionShot(selector,name,offset);

          await page.waitForSelector('.v55-process-journey',{state:'attached',timeout:15000});
          const processProgress=[.04,.23,.44,.65,.84,.94];
          for(let i=0;i<processProgress.length;i++){
            const p=processProgress[i];
            await page.evaluate(p=>{
              const s=document.querySelector('.v55-process-journey');
              const top=window.scrollY+s.getBoundingClientRect().top;
              const travel=Math.max(1,s.offsetHeight-window.innerHeight);
              window.scrollTo(0,top+travel*p);
            },p);
            await page.waitForTimeout(1050);
            const state=await page.evaluate(()=>{
              const audit=window.__MOVX_V57_AUDIT__.inspect();
              const title=document.querySelector('#process .process-title h2')?.getBoundingClientRect();
              const row=document.querySelector('#process .process-list li.v55-current');
              const rr=row?.getBoundingClientRect();
              return {audit,title:title?{left:title.left,right:title.right,top:title.top,bottom:title.bottom}:null,row:rr?{left:rr.left,right:rr.right,top:rr.top,bottom:rr.bottom}:null};
            });
            report.process.push({progress:p,...state});
            if(state.audit.overflow>2) throw new Error(`process ${p}: overflow`);
            if(!state.audit.currentText.length) throw new Error(`process ${p}: no current readable row`);
            if(state.audit.currentText.some(x=>x.opacity<.72)) throw new Error(`process ${p}: active text opacity too low`);
            if(state.title&&(state.title.left<-4||state.title.right>1444)) throw new Error(`process ${p}: title clipped ${JSON.stringify(state.title)}`);
            if(state.row&&(state.row.left<-4||state.row.right>1444)) throw new Error(`process ${p}: row clipped ${JSON.stringify(state.row)}`);
            await page.screenshot({path:`_site/qa-v57-process-${String(i+1).padStart(2,'0')}.png`,fullPage:false});
          }

          await sectionShot('#contact','07-contact',.08);
          const contactState=await page.evaluate(()=>{
            const c=document.querySelector('#contact'),grid=c.querySelector('.contact-grid'),h=c.querySelector('.contact-copy h2');
            const cr=c.getBoundingClientRect(),gr=grid.getBoundingClientRect(),hr=h?.getBoundingClientRect();
            return {phase:document.documentElement.dataset.v56Phase||'',gridOpacity:parseFloat(getComputedStyle(grid).opacity||'1'),contact:{top:cr.top,bottom:cr.bottom},grid:{left:gr.left,right:gr.right},heading:hr?{left:hr.left,right:hr.right,top:hr.top,bottom:hr.bottom}:null};
          });
          report.desktop.push({label:'07-contact-state',...contactState});
          if(contactState.gridOpacity<.8) throw new Error('Contact grid opacity too low');
          if(contactState.heading&&(contactState.heading.left<-4||contactState.heading.right>1444)) throw new Error('Contact heading clipped');

          await page.evaluate(()=>window.scrollTo(0,0));
          await page.locator('[data-open-project]').first().click({force:true});
          await page.waitForSelector('#caseViewer.open',{state:'visible',timeout:12000});
          await page.waitForTimeout(1000);
          let caseState=await page.evaluate(()=>{
            const v=document.querySelector('#caseViewer'),title=v.querySelector('.case-hero__title'),deck=v.querySelector('.case-hero__deck');
            const tr=title?.getBoundingClientRect(),dr=deck?.getBoundingClientRect();
            return {overflow:v.scrollWidth-v.clientWidth,title:tr?{left:tr.left,right:tr.right,top:tr.top,bottom:tr.bottom}:null,deck:dr?{left:dr.left,right:dr.right,top:dr.top,bottom:dr.bottom}:null};
          });
          report.case.push({label:'hero',...caseState});
          if(caseState.overflow>2) throw new Error('Case hero horizontal overflow');
          if(caseState.title&&(caseState.title.left<-4||caseState.title.right>1444)) throw new Error('Case title clipped');
          await page.screenshot({path:'_site/qa-v57-08-case-hero.png',fullPage:false});
          await page.evaluate(()=>{const v=document.querySelector('#caseViewer'),info=document.querySelector('#caseInfo');v.scrollTop=Math.max(0,info.offsetTop-90);});
          await page.waitForTimeout(900);
          await page.screenshot({path:'_site/qa-v57-09-case-info.png',fullPage:false});

          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const mobileErrors=[]; mobile.on('pageerror',err=>mobileErrors.push(String(err)));
          await mobile.goto('http://127.0.0.1:4173/v57.html?v=57-motion-integrity',{waitUntil:'networkidle'});
          await mobile.waitForFunction(()=>window.__MOVX_V57_AUDIT__,null,{timeout:20000});
          await mobile.addStyleTag({content:'html,body{scroll-behavior:auto!important}'});
          async function mobileShot(selector,name){
            await mobile.evaluate(selector=>{const el=document.querySelector(selector);if(!el)throw new Error('Missing '+selector);const top=window.scrollY+el.getBoundingClientRect().top;window.scrollTo(0,Math.max(0,top-72));},selector);
            await mobile.waitForTimeout(700);
            const state=await mobile.evaluate(()=>window.__MOVX_V57_AUDIT__.inspect());
            report.mobile.push({name,...state});
            if(state.overflow>2) throw new Error(`mobile ${name}: overflow ${state.overflow}`);
            await mobile.screenshot({path:`_site/qa-v57-mobile-${name}.png`,fullPage:false});
          }
          await mobile.screenshot({path:'_site/qa-v57-mobile-00-home.png',fullPage:false});
          for(const [sel,name] of [['#nicheIndex','01-territories'],['.projects-list','02-selected'],['#about','03-about'],['#services','04-services'],['#process','05-process'],['#contact','06-contact']]) await mobileShot(sel,name);
          const mobileProcess=await mobile.evaluate(()=>({rows:[...document.querySelectorAll('#process .process-list li')].map(el=>({position:getComputedStyle(el).position,opacity:parseFloat(getComputedStyle(el).opacity||'1')})),layer:document.querySelector('.v56-handoff-layer')?getComputedStyle(document.querySelector('.v56-handoff-layer')).display:'absent'}));
          if(mobileProcess.rows.some(x=>x.position==='absolute'||x.opacity<.88)) throw new Error('Mobile Process readability regression '+JSON.stringify(mobileProcess));
          if(mobileErrors.length) throw new Error('Mobile page errors: '+mobileErrors.join(' | '));

          if(pageErrors.length) throw new Error('Desktop page errors: '+pageErrors.join(' | '));
          await writeFile('_site/qa-v57-report.json',JSON.stringify(report,null,2));
          await mobile.close();
          await browser.close();
          NODE
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
          test -s _site/qa-v57-report.json
          test -s _site/qa-v57-00-home.png
          test -s _site/qa-v57-process-03.png
          test -s _site/qa-v57-07-contact.png
          test -s _site/qa-v57-08-case-hero.png
          test -s _site/qa-v57-mobile-06-contact.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
