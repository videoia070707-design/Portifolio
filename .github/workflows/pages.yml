name: Deploy MOVX Portfolio

on:
  push:
    branches: [main, movx-v380-channel-retune]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure FFmpeg for optimized media
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build optimized MOVX source
        run: npm run build
      - name: Enforce performance budgets
        run: python3 scripts/qa-performance.py
      - name: Enforce Scene 01 static contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qa-v379-static.py
          python3 scripts/qa-v380-static.py
      - name: Store immutable build for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: movx-built-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  qa-contracts:
    name: QA CRT-first runtime contracts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate storyboard, CRT gate, loading, motion, channels, manipulation, physics, object presence, director and scene presence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/qa-logs
          python3 -m http.server 4173 --directory _site >_site/qa-logs/contracts.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/qa-v322-runtime.cjs
          node scripts/qa-v351-recenter.cjs
          node scripts/qa-v321-production.cjs
          node scripts/qa-v353-motion.cjs
          node scripts/qa-v354-boot-choreo.cjs
          node scripts/qa-v355-crt-fastload.cjs
          node scripts/qa-v358-crt-immersion.cjs
          node scripts/qa-v359-channel-flow.cjs
          node scripts/qa-v361-channel-experience.cjs
          node scripts/qa-v362-crt-tactility.cjs
          node scripts/qa-v363-crt-direct-manipulation.cjs
          node scripts/qa-v364-crt-object-interaction.cjs
          node scripts/qa-v365-crt-channel-physics.cjs
          node scripts/qa-v366-clean-boot-presence.cjs
          node scripts/qa-v367-crt-scene-director.cjs
          node scripts/qa-v368-scene-presence.cjs
      - name: Save contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-qa-contracts
          path: |
            _site/qa-v368-*
            _site/qa-v367-*
            _site/qa-v366-*
            _site/qa-v365-*
            _site/qa-v364-*
            _site/qa-v363-*
            _site/qa-v362-*
            _site/qa-v361-*
            _site/qa-v359-*
            _site/qa-v358-*
            _site/qa-v355-*
            _site/qa-v354-*
            _site/qa-v353-*
            _site/qa-v351-*
            _site/qa-v350-*
            _site/qa-v349-*
            _site/qa-v322-*
            _site/qa-v321-*
            _site/qa-model-*
            _site/qa-logs/contracts.log
          if-no-files-found: warn
          retention-days: 7

  qa-scene-frame:
    name: QA Scene 01 frame, light, volume, interactions, editorial safe zones and channel retune
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate Scene 01 physical and editorial composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/qa-logs
          python3 -m http.server 4174 --directory _site >_site/qa-logs/scene-frame.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v369-scene01-full-bleed.cjs > _site/qa-logs/qa-v369-scene-frame.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v370-crt-light-spill.cjs > _site/qa-logs/qa-v370-crt-light-spill.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v371-crt-object-volume.cjs > _site/qa-logs/qa-v371-crt-object-volume.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v372-channel-pose-authority.cjs > _site/qa-logs/qa-v372-channel-pose-authority.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v373-crt-instant-presence.cjs > _site/qa-logs/qa-v373-crt-instant-presence.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v375-crt-spatial-grab.cjs > _site/qa-logs/qa-v375-crt-spatial-grab.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v376-crt-elastic-orbit.cjs > _site/qa-logs/qa-v376-crt-elastic-orbit.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v377-crt-focus-pull.cjs > _site/qa-logs/qa-v377-crt-focus-pull.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v378-crt-physical-pickup.cjs > _site/qa-logs/qa-v378-crt-physical-pickup.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v379-scene01-editorial-grid.cjs > _site/qa-logs/qa-v379-editorial-grid.cjs
          sed 's/127\.0\.0\.1:4173/127.0.0.1:4174/g' scripts/qa-v380-crt-channel-retune.cjs > _site/qa-logs/qa-v380-channel-retune.cjs
          node _site/qa-logs/qa-v369-scene-frame.cjs
          node _site/qa-logs/qa-v370-crt-light-spill.cjs
          node _site/qa-logs/qa-v371-crt-object-volume.cjs
          node _site/qa-logs/qa-v373-crt-instant-presence.cjs
          node _site/qa-logs/qa-v372-channel-pose-authority.cjs
          node _site/qa-logs/qa-v375-crt-spatial-grab.cjs
          node _site/qa-logs/qa-v376-crt-elastic-orbit.cjs
          node _site/qa-logs/qa-v377-crt-focus-pull.cjs
          node _site/qa-logs/qa-v378-crt-physical-pickup.cjs
          node _site/qa-logs/qa-v379-editorial-grid.cjs
          node _site/qa-logs/qa-v380-channel-retune.cjs
      - name: Save Scene 01 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-qa-scene-frame
          path: |
            _site/qa-v369-*
            _site/qa-v370-*
            _site/qa-v371-*
            _site/qa-v372-*
            _site/qa-v373-*
            _site/qa-v375-*
            _site/qa-v376-*
            _site/qa-v377-*
            _site/qa-v378-*
            _site/qa-v379-*
            _site/qa-v380-*
            _site/qa-logs/scene-frame.log
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Publish Pages
    needs: [build, qa-contracts, qa-scene-frame]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Restore validated build
        uses: actions/download-artifact@v4
        with:
          name: movx-built-site
          path: _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
