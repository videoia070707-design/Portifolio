name: MOVX Text Integrity QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  text-integrity:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download deployed Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract deployed site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s _artifact/artifact.tar
          tar -xf _artifact/artifact.tar -C _site
          test -s _site/index.html
          test -s _site/v88-chapter.js
          grep -q 'v95-whole-page-damped-continuity' _site/v88-chapter.js

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-text-integrity.log 2>&1

      - name: Audit clipping and text collisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 --directory _site >/tmp/movx-text-integrity-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report = {motion:'v95-whole-page-damped-continuity',desktop:[],mobile:[],errors:[]};

          const sections = [
            ['#heroTop','hero'],
            ['#livingArchive','archive'],
            ['#nicheIndex','territories'],
            ['#archiveControls','directory'],
            ['.projects-list','projects'],
            ['#about','about'],
            ['#services','services'],
            ['#process','process'],
            ['#contact','contact']
          ];

          async function runViewport(label, viewport){
            const page = await browser.newPage({viewport,deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',err=>pageErrors.push(String(err)));
            await page.goto('http://127.0.0.1:4180/index.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__MOVX_V57_AUDIT__,null,{timeout:20000});
            await page.waitForFunction(()=>document.documentElement.dataset.movxMotion==='v95-whole-page-damped-continuity',null,{timeout:10000});
            await page.addStyleTag({content:'html,body{scroll-behavior:auto!important}'});

            if(label==='mobile'){
              await page.waitForFunction(()=>document.documentElement.dataset.movxMobileArchiveAudit==='hover-overlays-inactive',null,{timeout:10000});
              const activeOverlays=await page.locator('#loopWall .loop-card__overlay:not([aria-hidden="true"])').count();
              if(activeOverlays) throw new Error(`mobile archive still exposes ${activeOverlays} hover-only overlays`);
            }

            for(const [selector,name] of sections){
              const exists=await page.locator(selector).count();
              if(!exists) throw new Error(`${label}/${name}: missing ${selector}`);
              await page.evaluate(selector=>{
                const el=document.querySelector(selector);
                const top=window.scrollY+el.getBoundingClientRect().top;
                window.scrollTo(0,Math.max(0,top-72));
              },selector);
              await page.waitForTimeout(900);

              const state=await page.evaluate(({selector,name})=>{
                const viewport={w:innerWidth,h:innerHeight};
                const section=document.querySelector(selector);
                const majorSelector='h1,h2,h3,strong,.kicker,.section-intro p,.about-copy p,.contact-copy p,.service-row p,#process .process-list p';

                const ancestorsVisible=(el)=>{
                  if(el.closest('[aria-hidden="true"],[hidden]')) return false;
                  let cur=el;
                  while(cur&&cur!==document.documentElement){
                    const cs=getComputedStyle(cur);
                    if(cs.display==='none'||cs.visibility==='hidden'||parseFloat(cs.opacity||'1')<.16) return false;
                    cur=cur.parentElement;
                  }
                  return true;
                };
                const intersects=(r)=>r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth;
                const candidates=[...section.querySelectorAll(majorSelector)].filter(el=>{
                  if(el.closest('.loop-card__overlay,[aria-hidden="true"],.v42-parallax-layer,.v49-journey-stage,.v52-architecture-stage,.v54-portal-sequence,.v55-process-canvas,.v55-process-hud,.v55-process-depth,.v55-process-outro,.v56-handoff-layer')) return false;
                  const row=el.closest('#process .process-list li');
                  if(row&&innerWidth>980&&!row.classList.contains('v55-current')) return false;
                  const r=el.getBoundingClientRect();
                  return r.width>2&&r.height>2&&intersects(r)&&ancestorsVisible(el);
                });

                const clips=[];
                for(const el of candidates){
                  if(!/H[1-3]|STRONG/.test(el.tagName)) continue;
                  const r=el.getBoundingClientRect();
                  if(r.left<-4||r.right>innerWidth+4){
                    clips.push({text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,100),left:Math.round(r.left),right:Math.round(r.right),vw:innerWidth});
                  }
                }

                const collisions=[];
                const rects=candidates.map(el=>({el,r:el.getBoundingClientRect(),text:(el.textContent||'').trim().replace(/\s+/g,' ').slice(0,80)}));
                for(let i=0;i<rects.length;i++){
                  for(let j=i+1;j<rects.length;j++){
                    const a=rects[i],b=rects[j];
                    if(a.el.contains(b.el)||b.el.contains(a.el)) continue;
                    if(a.el.closest('.loop-card,.archive-card,.niche-card,.project-cover')&&a.el.closest('.loop-card,.archive-card,.niche-card,.project-cover')===b.el.closest('.loop-card,.archive-card,.niche-card,.project-cover')) continue;
                    const iw=Math.min(a.r.right,b.r.right)-Math.max(a.r.left,b.r.left);
                    const ih=Math.min(a.r.bottom,b.r.bottom)-Math.max(a.r.top,b.r.top);
                    if(iw<=8||ih<=6) continue;
                    const overlap=iw*ih;
                    const minArea=Math.max(1,Math.min(a.r.width*a.r.height,b.r.width*b.r.height));
                    const ratio=overlap/minArea;
                    if(ratio>.18){
                      collisions.push({a:a.text,b:b.text,ratio:Number(ratio.toFixed(3)),iw:Math.round(iw),ih:Math.round(ih)});
                    }
                  }
                }

                return {
                  name,
                  chapter:document.documentElement.dataset.movxCurrentChapter||'',
                  motion:document.documentElement.dataset.movxMotion||'',
                  overflow:document.documentElement.scrollWidth-innerWidth,
                  clips,
                  collisions
                };
              },{selector,name});

              report[label].push(state);
              if(state.overflow>2) throw new Error(`${label}/${name}: horizontal page overflow ${state.overflow}`);
              if(state.clips.length) throw new Error(`${label}/${name}: visible heading clip ${JSON.stringify(state.clips.slice(0,3))}`);
              if(state.collisions.length) throw new Error(`${label}/${name}: visible text collision ${JSON.stringify(state.collisions.slice(0,3))}`);
            }

            if(pageErrors.length) throw new Error(`${label}: page errors ${pageErrors.join(' | ')}`);
            await page.close();
          }

          try{
            await runViewport('desktop',{width:1440,height:900});
            await runViewport('mobile',{width:390,height:844});
          }catch(error){
            report.errors.push(String(error));
            await writeFile('_site/qa-text-integrity-report.json',JSON.stringify(report,null,2));
            await browser.close();
            throw error;
          }

          await writeFile('_site/qa-text-integrity-report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE

          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
          test -s _site/qa-text-integrity-report.json

      - name: Upload text-integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-text-integrity-report
          path: _site/qa-text-integrity-report.json
          if-no-files-found: warn
          retention-days: 7
