name: MOVX Motion Quality QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  motion-quality:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download deployed Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract deployed site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          test -s _artifact/artifact.tar
          tar -xf _artifact/artifact.tar -C _site
          test -s _site/index.html
          test -s _site/social-media.html
          test -s _site/v88-chapter.js
          grep -q 'v98-continuous-media-response' _site/v88-chapter.js

      - name: Install browser QA runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-motion-quality.log 2>&1

      - name: Audit continuous territory response
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4181 --directory _site >/tmp/movx-motion-quality-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const detail='v98-continuous-media-response';
          const pagePath='social-media.html';
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={detail,page:pagePath,desktop:{},reduced:{},errors:[]};
          const parsePx=value=>Number.parseFloat(value)||0;

          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const pageErrors=[];
            page.on('pageerror',err=>pageErrors.push(String(err)));
            await page.goto(`http://127.0.0.1:4181/${pagePath}`,{waitUntil:'networkidle'});
            await page.waitForFunction(expected=>document.documentElement.dataset.movxMotionDetail===expected,detail,{timeout:15000});

            const card=page.locator('#nicheGrid .niche-card').first();
            const media=card.locator('.niche-card__media').first();
            if(!await card.count()||!await media.count()) throw new Error('territory card/media missing');
            await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(300);

            const marker=await media.getAttribute('data-v98-pointer');
            if(marker!=='smooth') throw new Error(`v98 pointer owner missing: ${marker}`);

            const box=await card.boundingBox();
            if(!box) throw new Error('territory card has no bounding box');
            const read=()=>media.evaluate(el=>({
              x:getComputedStyle(el).getPropertyValue('--v88-media-x').trim(),
              y:getComputedStyle(el).getPropertyValue('--v88-media-y').trim()
            }));

            // Use real pointer movement for the active response contract.
            await page.mouse.move(box.x+box.width*.95,box.y+box.height*.05);
            await page.waitForTimeout(38);
            const early=await read();
            await page.waitForTimeout(220);
            const settled=await read();
            const earlyMag=Math.hypot(parsePx(early.x),parsePx(early.y));
            const settledMag=Math.hypot(parsePx(settled.x),parsePx(settled.y));
            if(settledMag<.35) throw new Error(`territory response too small: ${settledMag}`);
            if(settledMag+0.05<earlyMag) throw new Error(`territory response regressed during settle: early=${earlyMag} settled=${settledMag}`);

            // Pointer hit-testing around transformed editorial cards is flaky in headless
            // Chromium. The production contract lives on the card listener itself:
            // pointerleave must zero the targets and the frame owner must damp them home.
            const leaveDispatched=await card.evaluate(el=>el.dispatchEvent(new PointerEvent('pointerleave',{
              bubbles:false,cancelable:false,pointerType:'mouse',isPrimary:true
            })));
            await page.waitForFunction(()=>{
              const el=document.querySelector('#nicheGrid .niche-card__media');
              if(!el)return false;
              const cs=getComputedStyle(el);
              const x=Number.parseFloat(cs.getPropertyValue('--v88-media-x'))||0;
              const y=Number.parseFloat(cs.getPropertyValue('--v88-media-y'))||0;
              return Math.hypot(x,y)<.24;
            },null,{timeout:2500});
            const returned=await read();
            const returnMag=Math.hypot(parsePx(returned.x),parsePx(returned.y));
            if(returnMag>.24) throw new Error(`territory response did not ease home: ${returnMag}`);

            report.desktop={marker,early,settled,returned,earlyMag,settledMag,returnMag,leaveDispatched,direction:await page.evaluate(()=>document.documentElement.dataset.movxScrollDirection||'')};
            if(pageErrors.length) throw new Error(`desktop page errors: ${pageErrors.join(' | ')}`);
            await page.close();

            const staticPage=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            await staticPage.goto(`http://127.0.0.1:4181/${pagePath}?static=1`,{waitUntil:'networkidle'});
            await staticPage.waitForFunction(expected=>document.documentElement.dataset.movxMotionDetail===expected,detail,{timeout:15000});
            const staticMarker=await staticPage.locator('#nicheGrid .niche-card__media').first().getAttribute('data-v98-pointer');
            if(staticMarker==='smooth') throw new Error('reduced-motion page still binds v98 pointer owner');
            report.reduced={pointerOwner:staticMarker||'disabled'};
            await staticPage.close();
          }catch(error){
            report.errors.push(String(error));
            await writeFile('_site/qa-motion-quality-report.json',JSON.stringify(report,null,2));
            await browser.close();
            throw error;
          }

          await writeFile('_site/qa-motion-quality-report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE

          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT
          test -s _site/qa-motion-quality-report.json

      - name: Upload motion-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-motion-quality-report
          path: _site/qa-motion-quality-report.json
          if-no-files-found: warn
          retention-days: 7
