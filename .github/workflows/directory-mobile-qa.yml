name: MOVX Directory Mobile QA

on:
  workflow_run:
    workflows: ["Deploy MOVX Portfolio"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory-mobile-qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --silent --no-progress --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1

      - name: Validate Directory filters on touch layouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-directory
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const base='https://videoia070707-design.github.io/Portifolio/social-media.html';
          const viewports=[
            {id:'mobile-390',width:390,height:844},
            {id:'mobile-430',width:430,height:932}
          ];
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const report={page:base,pages:[],interactions:[],errors:[]};

          const inspect=async page=>page.evaluate(()=>{
            const section=document.querySelector('#archiveControls');
            const board=document.querySelector('#filterBoard');
            const grid=document.querySelector('#archiveGrid');
            const status=document.querySelector('#archiveFilterStatus');
            const formatButtons=[...document.querySelectorAll('#archiveFilters .archive-filter')];
            const nicheButtons=[...document.querySelectorAll('#archiveNicheFilters .archive-filter')];
            const cards=[...grid?.querySelectorAll('.archive-card')||[]];
            const rect=el=>{if(!el)return null;const r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};};
            const visible=cards.filter(card=>{
              const r=card.getBoundingClientRect(),cs=getComputedStyle(card);
              return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth&&cs.display!=='none'&&cs.visibility!=='hidden';
            });
            return {
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              scrollY:window.scrollY,
              section:rect(section),board:rect(board),grid:rect(grid),
              status:(status?.textContent||'').trim(),
              formatCount:formatButtons.length,nicheCount:nicheButtons.length,cardCount:cards.length,
              activeFormat:formatButtons.find(x=>x.classList.contains('active'))?.dataset.projectFilter||'',
              activeNiche:nicheButtons.find(x=>x.classList.contains('active'))?.dataset.projectNiche||'',
              formatStripOverflow:document.querySelector('#archiveFilters')?.scrollWidth-document.querySelector('#archiveFilters')?.clientWidth||0,
              nicheStripOverflow:document.querySelector('#archiveNicheFilters')?.scrollWidth-document.querySelector('#archiveNicheFilters')?.clientWidth||0,
              visibleCards:visible.length,
              visibleCardOpacities:visible.slice(0,4).map(card=>Number((parseFloat(getComputedStyle(card).opacity||'1')).toFixed(3))),
              loadedImages:cards.map(c=>c.querySelector('img')).filter(img=>img?.complete&&img.naturalWidth>0).length,
              visibleLoadedImages:visible.map(c=>c.querySelector('img')).filter(img=>img?.complete&&img.naturalWidth>0).length
            };
          });

          async function focusFilterBoard(page){
            const board=page.locator('#filterBoard');
            await board.scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>{
              const el=document.querySelector('#filterBoard');
              if(!el)return false;
              const r=el.getBoundingClientRect();
              return r.bottom>0&&r.top<innerHeight;
            },null,{timeout:10000});
            await page.waitForTimeout(250);
          }

          async function focusFirstResult(page){
            const first=page.locator('#archiveGrid .archive-card').first();
            await first.waitFor({state:'attached',timeout:10000});
            await first.scrollIntoViewIfNeeded();
            await page.waitForFunction(()=>{
              const card=document.querySelector('#archiveGrid .archive-card');
              if(!card)return false;
              const r=card.getBoundingClientRect(),cs=getComputedStyle(card);
              return r.bottom>0&&r.top<innerHeight&&r.right>0&&r.left<innerWidth&&cs.display!=='none'&&cs.visibility!=='hidden';
            },null,{timeout:10000});
            await page.waitForFunction(()=>{
              const img=document.querySelector('#archiveGrid .archive-card img');
              return !img||(img.complete&&img.naturalWidth>0);
            },null,{timeout:10000}).catch(()=>{});
            await page.waitForTimeout(350);
          }

          try{
            for(const viewport of viewports){
              const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height},deviceScaleFactor:1,hasTouch:true,isMobile:true});
              const errors=[]; page.on('pageerror',error=>errors.push(String(error)));
              await page.goto(`${base}?qa-directory=${Date.now()}`,{waitUntil:'networkidle',timeout:45000});
              await page.waitForSelector('#archiveGrid .archive-card',{state:'attached',timeout:15000});

              await focusFilterBoard(page);
              const initialControls=await inspect(page);
              if(initialControls.overflow>2) throw new Error(`${viewport.id}: document overflow ${initialControls.overflow}`);
              if(initialControls.formatCount<5||initialControls.nicheCount<2) throw new Error(`${viewport.id}: filters incomplete ${JSON.stringify(initialControls)}`);
              if(initialControls.cardCount<6) throw new Error(`${viewport.id}: directory grid incomplete ${initialControls.cardCount}`);
              if(initialControls.activeFormat!=='all'||initialControls.activeNiche!=='all') throw new Error(`${viewport.id}: wrong initial filters ${JSON.stringify(initialControls)}`);

              await focusFirstResult(page);
              const initial=await inspect(page);
              if(initial.visibleCards<1) throw new Error(`${viewport.id}: directory has no visible result after result focus ${JSON.stringify(initial)}`);
              if(initial.visibleLoadedImages<1) throw new Error(`${viewport.id}: initial visible result media did not load ${JSON.stringify(initial)}`);
              if(errors.length) throw new Error(`${viewport.id}: page errors ${errors.join(' | ')}`);
              await page.screenshot({path:`qa-directory/${viewport.id}-initial.png`,fullPage:false});

              await page.locator('#archiveFilters [data-project-filter="carousel"]').tap();
              await page.waitForFunction(()=>document.querySelector('#archiveFilters [data-project-filter="carousel"]')?.classList.contains('active'),null,{timeout:10000});
              await focusFirstResult(page);
              const carousel=await inspect(page);
              if(carousel.overflow>2||carousel.activeFormat!=='carousel'||carousel.cardCount<1) throw new Error(`${viewport.id}: carousel filter failed ${JSON.stringify(carousel)}`);
              if(carousel.visibleCards<1) throw new Error(`${viewport.id}: carousel results are not visible ${JSON.stringify(carousel)}`);
              if(carousel.visibleLoadedImages<1) throw new Error(`${viewport.id}: carousel visible media did not load ${JSON.stringify(carousel)}`);
              await page.screenshot({path:`qa-directory/${viewport.id}-carousel.png`,fullPage:false});

              await page.locator('#archiveFilters [data-project-filter="all"]').tap();
              await page.waitForFunction(()=>document.querySelector('#archiveFilters [data-project-filter="all"]')?.classList.contains('active'),null,{timeout:10000});
              const niche=page.locator('#archiveNicheFilters [data-project-niche]:not([data-project-niche="all"])').first();
              const nicheKey=await niche.getAttribute('data-project-niche');
              await niche.tap();
              await page.waitForFunction(key=>document.querySelector(`#archiveNicheFilters [data-project-niche="${key}"]`)?.classList.contains('active'),nicheKey,{timeout:10000});
              await focusFirstResult(page);
              const nicheState=await inspect(page);
              if(nicheState.overflow>2||nicheState.activeNiche!==nicheKey||nicheState.cardCount<1) throw new Error(`${viewport.id}: niche filter failed ${JSON.stringify(nicheState)}`);
              if(nicheState.visibleCards<1) throw new Error(`${viewport.id}: niche results are not visible ${JSON.stringify(nicheState)}`);
              if(nicheState.visibleLoadedImages<1) throw new Error(`${viewport.id}: niche visible media did not load ${JSON.stringify(nicheState)}`);
              await page.screenshot({path:`qa-directory/${viewport.id}-niche.png`,fullPage:false});

              report.pages.push({viewport,initialControls,initial,errors});
              report.interactions.push({viewport:viewport.id,carousel,niche:nicheState,nicheKey});
              await writeFile('qa-directory/report.json',JSON.stringify(report,null,2));
              await page.close();
            }
          }catch(error){
            report.errors.push(String(error));
            await writeFile('qa-directory/report.json',JSON.stringify(report,null,2));
            await browser.close();
            throw error;
          }

          await writeFile('qa-directory/report.json',JSON.stringify(report,null,2));
          await browser.close();
          NODE

      - name: Upload Directory QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movx-directory-mobile-qa
          path: qa-directory
          if-no-files-found: warn
          retention-days: 7
